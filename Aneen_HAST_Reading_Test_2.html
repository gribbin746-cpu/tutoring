const passages = [{"title": "The last label", "html": "\u003cp>\u003cspan class=\"para\">1\u003c/span>Dad kept the orchard labels in a tobacco tin, sorted by row and tied with string. The labels for the trees he had cut down were still there. He said the next owner ought to know what had grown in the gaps.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>On the morning of the sale, Mr Dwyer from the agent’s office walked the rows with me. At the far gate he lifted a loop of wire with his pen. The wood it had held was lying face down. He wrote ‘unmarked apple’ on his sheet. I said the apples went soft in the middle before the skin showed anything. He waited for me to say something he could put in the box.\u003c/p>\u003cp>\u003cspan class=\"para\">3\u003c/span>I found the label in the grass. Dad had written ‘Not for keeping’ under the name. There was no room for the second line on Mr Dwyer’s sheet, so I read him the name and slipped the label into my coat.\u003c/p>\u003cp>\u003cspan class=\"para\">4\u003c/span>At the house I put the label in the tin. There was already one from the far gate, older and split through the middle. It had the name in my own writing, from the year Dad let me do the labels. On the back he had pencilled ‘Good off the tree’. I put both labels back. Then I got a piece of card and wrote the two lines out for Mr Dwyer. I left it under the clip on his board.\u003c/p>"}, {"title": "A cooler seat", "html": "\u003cp>\u003cspan class=\"para\">1\u003c/span>The school wanted to find out which of two shelters would make the lunch benches more comfortable. One had a pale canvas roof. The other had timber slats with narrow gaps. Both shelters were put over identical metal benches in the same courtyard. A third bench stayed in the sun.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>The class took readings at noon and two on a clear Tuesday. Air temperature was taken in the shade of a small screen at seat height. Seat temperature was taken in the middle of each bench with the same surface thermometer. At two, sunlight passing between the timber slats reached one end of the seat. The probe still went in the middle.\u003c/p>\u003cp>\u003cspan class=\"para\">3\u003c/span>The principal initially asked for a single winner. The class recommended the canvas for this courtyard if the aim was to keep the seats cool at the times measured. Its report also proposed taking readings at several points along each bench before ordering another shelter. The class left the question of summer performance open. The angle of the sun would change, as would the hours during which pupils used the seats.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption>Tuesday readings in degrees Celsius\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Bench\u003c/th>\u003cth scope=\"col\">Air at noon\u003c/th>\u003cth scope=\"col\">Seat at noon\u003c/th>\u003cth scope=\"col\">Air at 2 pm\u003c/th>\u003cth scope=\"col\">Seat at 2 pm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Canvas\u003c/td>\u003ctd>28\u003c/td>\u003ctd>29\u003c/td>\u003ctd>31\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slats\u003c/td>\u003ctd>28\u003c/td>\u003ctd>31\u003c/td>\u003ctd>31\u003c/td>\u003ctd>36\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open\u003c/td>\u003ctd>29\u003c/td>\u003ctd>42\u003c/td>\u003ctd>32\u003c/td>\u003ctd>48\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"title": "On the platform", "html": "\u003ch3>Text A · In a Station of the Metro\u003c/h3>\u003cp class=\"verse\">The apparition of these faces in the crowd:\u003cbr>Petals on a wet, black bough.\u003c/p>\u003ch3>Text B · Platform 3\u003c/h3>\u003cp>\u003cspan class=\"para\">1\u003c/span>A storm had stalled the trains. On the platform display, ‘2 min’ hung there for so long that people had stopped looking up when the display clicked. I had counted the blue tiles opposite often enough to know that one, high near the clock, was a shade lighter than its neighbours.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>A woman next to me was trying to close a broken umbrella. Every time she gathered one side, another sprang out. The man across from her took a rubber band off his newspaper and held it out. She took it. Neither spoke. The paper spread slowly across the man’s knees.\u003c/p>\u003cp>\u003cspan class=\"para\">3\u003c/span>When the train finally came, the woman and the man boarded through different doors. I caught sight of the paper in the carriage ahead. The man was holding it by both corners while he turned a page with his chin. At the next stop, the paper was gone from the window. There was only a wall of blue tiles again.\u003c/p>"}, {"title": "Ferry notices", "html": "\u003cp>\u003cspan class=\"para\">1\u003c/span>On Saturdays all three ferries leave Landing K and stop at Landing L before finishing at Landing M. Bicycles aboard the 9.05 and 10.05 ferries must be booked by 6 pm on Friday. The 9.35 carries passengers only. Walk-on passengers do not need to book. Everyone must be at the departure gate at least five minutes before the printed departure.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>On market Saturdays, Landing L is closed to arrivals and departures until 9.45. If a scheduled stop falls during the closure, the ferry skips L and keeps its printed arrival time at M. The promenade from L to M takes 18 minutes on foot. The shorter route between those landings crosses the market grounds and opens at 10 am.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption>Saturday ferry timetable\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Service\u003c/th>\u003cth scope=\"col\">Leave K\u003c/th>\u003cth scope=\"col\">Stop at L\u003c/th>\u003cth scope=\"col\">Arrive M\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Early\u003c/td>\u003ctd>9.05\u003c/td>\u003ctd>9.17\u003c/td>\u003ctd>9.30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Middle\u003c/td>\u003ctd>9.35\u003c/td>\u003ctd>9.47\u003c/td>\u003ctd>10.00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Late\u003c/td>\u003ctd>10.05\u003c/td>\u003ctd>10.17\u003c/td>\u003ctd>10.30\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"title": "The repair shelf", "html": "\u003ch3>Text A · Letter to the library\u003c/h3>\u003cp>\u003cspan class=\"para\">1\u003c/span>For years our Thursday repair group has brought its own pliers and screwdrivers. Half the calls I get now are from people who know how to tighten a loose handle and cannot justify buying the one tool they need. They ask if they can borrow mine. Why should they have to wait until Thursday?\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>Start with a small shelf of hand tools. Make the loans last three days and take a photo of each tool before it goes out. We do this with borrowed cameras for the library’s film club. If the shelf does little business, move it on. That would be a cheaper way of finding out who needs tools than paying for another survey.\u003c/p>\u003ch3>Text B · Librarian’s note\u003c/h3>\u003cp>\u003cspan class=\"para\">1\u003c/span>I am willing to set aside a shelf for a trial. A photo would tell staff what had gone out, but would rarely tell them if it still worked properly when it came back. A set of pliers can look much the same with a loose joint. For the first month, loans could leave and return during the Thursday session, when the repair group is already here to check equipment.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>We should count how often each tool is borrowed. We should also ask at the desk whether people tried and failed to borrow a tool at other times. Otherwise a quiet month may tell us only that Thursday is a poor day. If the checks prove easy for staff to do, we can spread them across the week.\u003c/p>"}, {"title": "The first record", "html": "\u003cp>\u003cspan class=\"para\">1\u003c/span>The town museum had a photograph of the first flood marker on the old bridge. The date on the back was 1910, in the slanting hand of someone who had written dates on a whole stack of photographs. The water had risen that winter. For years the museum’s card said the marker was put up after the 1910 flood.\u003c/p>\u003cp>\u003cspan class=\"para\">2\u003c/span>Then a roadworker, replacing a plank beneath the board, found two pairs of screw holes. The nearer pair matched the marker in the photograph. The other pair was wider apart. On its own, the second pair could have belonged to a notice or even a bracket for a rope. One of the curators thought it was a clue worth following. She looked for pictures taken from the bank.\u003c/p>\u003cp>\u003cspan class=\"para\">3\u003c/span>In a dated picture from 1908, a pale board can be seen in the right place. The detail is too small to read. A bridge keeper’s account from that year lists a payment for ‘a board showing the height of the last water’. The account does not name the bridge. It lists another payment for work on the downstream bridge on the same page.\u003c/p>\u003cp>\u003cspan class=\"para\">4\u003c/span>The curator replaced the museum card. The current version reads, ‘The marker shown in this photograph was in place by 1910. An earlier mark on this bridge is possible.’ A visitor asked why the card had got longer when the museum knew less. The curator pointed to the word ‘by’.\u003c/p>"}];
const questions = [{"stem": "Why does Mr Dwyer wait after the narrator describes the apples?", "skill": "Inference", "reason": "In paragraph 2 he has just written ‘unmarked apple’. The narrator’s description of the fruit gives useful information, but it leaves that identification unresolved.", "answer": "A", "options": ["He wants an identifying detail that fits his form.", "He expects the narrator to locate the fallen label.", "He is deciding if the fruit is fit to sell.", "He wants the narrator to explain what caused the damage."], "passage": 0}, {"stem": "Which detail most directly shows that the second label alters the narrator’s decision about what to pass on?", "skill": "Evidence", "reason": "The narrator first gives Mr Dwyer only the name. Writing both lines on a card is the action that changes what information he receives.", "answer": "B", "options": ["The narrator returns the two labels to the tin.", "The narrator writes both lines on a separate card.", "The narrator leaves the agent’s form as it is.", "The narrator finds the tree name in their own writing."], "passage": 0}, {"stem": "What is the principal effect of the tin appearing in the first and last paragraphs?", "skill": "Structure", "reason": "The father keeps information for the next owner. At the end, the narrator preserves that habit and goes further by passing on both observations.", "answer": "A", "options": ["A practice the father once explained is taken up by the narrator.", "The labels excluded from the sale are eventually returned to their proper places.", "A task the agent began is shown to depend on the father’s records.", "An object the narrator overlooked turns out to be valuable to the buyer."], "passage": 0}, {"stem": "What does ‘keeping’ mean on the label in paragraph 3?", "skill": "Vocabulary", "reason": "The apples soften before their skins give a warning. The older label’s ‘Good off the tree’ also concerns when to eat them.", "answer": "B", "options": ["Retaining the fruit for the family.", "Storing the fruit for later use.", "Saving the tree from being cut down.", "Keeping a written record of the tree."], "passage": 0}, {"stem": "What does the description ‘something he could put in the box’ bring out?", "skill": "Language", "reason": "The box can hold a name, but the story later makes clear that the form has no room for advice about the fruit.", "answer": "D", "options": ["The order in which the agent intends to inspect the remaining trees.", "The agent’s preference for explanations from experienced growers.", "The narrator’s difficulty recalling the exact wording of the label.", "The limits of the kind of information the agent is collecting."], "passage": 0}, {"stem": "Which conclusion is most clearly supported by the two labels together?", "skill": "Evidence", "reason": "‘Not for keeping’ concerns storage and ‘Good off the tree’ concerns eating it fresh. The notes can both be true.", "answer": "B", "options": ["The father corrected the narrator’s original identification.", "The father recorded a drawback and a good way to use the same fruit.", "The father changed his mind about how long the apples kept.", "The father thought the old label was clearer than the new one."], "passage": 0}, {"stem": "Which comparison best supports the claim that a single air reading can conceal a difference important to someone sitting down?", "skill": "Evidence", "reason": "At 2 pm the sheltered air readings both show 31°C, while the seats show 32°C and 36°C. This holds the measured air temperature equal.", "answer": "D", "options": ["Under canvas, both the air and the seat are warmer at 2 pm than at noon.", "At noon, the air by the open bench is one degree warmer than the air under canvas.", "At noon, the open bench and the slatted bench have different seat readings.", "At 2 pm, the two sheltered air readings match but their seat readings differ."], "passage": 1}, {"stem": "Why does paragraph 2 point out where the beam and the probe were?", "skill": "Inference", "reason": "Sun reaches an end of the slatted seat while the centre is measured. Consistent probe placement cannot show how hot the unmeasured end became.", "answer": "D", "options": ["The air screen may have shaded part of the slatted seat.", "The difference between shelters may come from a change in probe position.", "The class may have chosen the middle because it expected the poorest result there.", "The reading may miss the hottest patch of the slatted seat."], "passage": 1}, {"stem": "Which statement accurately describes the change in seat temperatures from noon to 2 pm?", "skill": "Data interpretation", "reason": "The slats-to-canvas gap grows from 31 − 29 = 2°C to 36 − 32 = 4°C. The open-to-slats gap grows from 11°C to 12°C.", "answer": "A", "options": ["The gap between the sheltered seats widened by two degrees.", "The slatted seat gained twice as many degrees as the canvas seat.", "The gap between the open and slatted seats narrowed by one degree.", "The canvas seat warmed by two degrees less than the open seat."], "passage": 1}, {"stem": "What is the effect of including the principal’s first request in paragraph 3?", "skill": "Structure", "reason": "The request for an outright winner is followed by a recommendation confined to a particular aim, site and set of observation times.", "answer": "C", "options": ["It shows why the pupils adopted more than one measurement method.", "It introduces the reason the open bench was included in the trial.", "It brings out the narrower conclusion the pupils are prepared to draw.", "It suggests the class expected the two shelters to work about equally."], "passage": 1}, {"stem": "Which extra test most directly addresses the seasonal uncertainty in the report?", "skill": "Inference", "reason": "The report identifies summer sun angle and changed hours of use. Only a summer trial at the relevant hours addresses both.", "answer": "C", "options": ["Repeat the noon readings with a second thermometer beside the first.", "Mea y establish that the pale board visible in 1908 marked a flood on the old bridge?", "skill": "Evidence", "reason": "A readable inscription would connect the purpose and the particular board at the photographed site and date. A flood or a payment alone cannot identify that board.", "answer": "D", "options": ["A diary saying that the river reached the deck of the old bridge in 1908.", "A receipt dated 1908 for two painted boards sent to the bridge keeper.", "A later sketch showing two flood markers on the two bridges without dates.", "A sharper copy of the same 1908 photograph on which the board’s water-height inscription is readable."], "passage": 5}];
const letters = ["A", "B", "C", "D"];
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const student = (params.get("student") || "").trim();
const linked = Boolean(student) && params.get("paper") === config.paperId && /^https?:$/.test(location.protocol);
const key = "gribbin:reading:" + config.paperId + ":" + (linked ? student.toLowerCase() : "guest");
let attempt = restore();
let showing = null;
let timer = null;
let sending = false;
const choices = [];

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(key) || "null");
    if (saved && Number.isFinite(saved.started) &&
        Array.isArray(saved.answers) && saved.answers.length === questions.length &&
        saved.answers.every((value) => value === null || letters.includes(value)) &&
        Array.isArray(saved.flags) && saved.flags.length === questions.length &&
        Number.isInteger(saved.index) && saved.index >= 0 && saved.index < questions.length &&
        (saved.finished === null || (Number.isFinite(saved.finished) && saved.finished >= saved.started))) return saved;
  } catch {}
  return null;
}

function persist() {
  try {
    localStorage.setItem(key, JSON.stringify(attempt));
  } catch {
    $("save-note").textContent = "This browser can’t save your answers between visits.";
  }
}

function stopAt() {
  return attempt.started + config.minutes * 60000;
}

function formatTime(seconds) {
  return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
}

function stats() {
  const skills = {};
  const wrong = [];
  let correct = 0;
  let answered = 0;
  questions.forEach((q, index) => {
    const picked = attempt.answers[index];
    if (picked !== null) answered += 1;
    const group = skills[q.skill] ?? (skills[q.skill] = {c: 0, t: 0});
    group.t += 1;
    if (picked === q.answer) {
      group.c += 1;
      correct += 1;
    } else {
      wrong.push({q: index + 1, picked, correct: q.answer, skill: q.skill,
        issue: picked === null ? "Unanswered" : q.skill, explanation: q.reason});
    }
  });
  return {correct, answered, skills, wrong};
}

function updateNumbers() {
  let answered = 0;
  attempt.answers.forEach((value, index) => {
    if (value !== null) answered += 1;
    const button = numberButtons[index];
    button.classList.toggle("answered", value !== null);
    button.classList.toggle("flagged", attempt.flags[index]);
    const state = value === null ? "unanswered" : "answered";
    button.setAttribute("aria-label", "Question " + (index + 1) + ", " + state + (attempt.flags[index] ? ", flagged" : ""));
    if (index === attempt.index) button.setAttribute("aria-current", "step");
    else button.removeAttribute("aria-current");
  });
  $("progress").textContent = answered + " of " + questions.length + " answered";
}

function renderQuestion() {
  const q = questions[attempt.index];
  const locked = attempt.finished !== null;
  if (showing !== q.passage) {
    const text = passages[q.passage];
    $("text-title").textContent = text.title;
    $("passage").innerHTML = text.html;
    $("reading").scrollTop = 0;
    showing = q.passage;
  }
  $("qnumber").textContent = "Question " + (attempt.index + 1) + " of " + questions.length;
  $("stem").textContent = q.stem;
  $("flag").hidden = locked;
  $("flag").setAttribute("aria-pressed", String(attempt.flags[attempt.index]));
  $("flag").textContent = attempt.flags[attempt.index] ? "Flagged" : "Flag";
  $("previous").disabled = attempt.index === 0;
  $("next").disabled = attempt.index === questions.length - 1;
  choices.forEach(({label, input, copy}, index) => {
    const letter = letters[index];
    const picked = attempt.answers[attempt.index] === letter;
    copy.textContent = q.options[index];
    input.checked = picked;
    input.disabled = locked;
    label.classList.toggle("correct", locked && q.answer === letter);
    label.classList.toggle("wrong", locked && picked && q.answer !== letter);
  });
  $("explanation").hidden = !locked;
  $("explanation").textContent = locked ? "Answer " + q.answer + ". " + q.reason : "";
  $("finish").textContent = locked ? "Results" : "Submit test";
  updateNumbers();
}

function openTest() {
  $("start").hidden = true;
  $("results").hidden = true;
  $("test").hidden = false;
  $("clock").hidden = attempt.finished !== null;
  renderQuestion();
  if (attempt.finished === null) {
    clearInterval(timer);
    timer = setInterval(tick, 250);
    tick();
  }
}

function tick() {
  if (!attempt || attempt.finished !== null) return;
  const left = Math.max(0, Math.ceil((stopAt() - Date.now()) / 1000));
  $("clock").textContent = formatTime(left);
  $("clock").classList.toggle("late", left <= 300);
  if (!left) finish(true);
}

function move(index) {
  if (index < 0 || index >= questions.length) return;
  attempt.index = index;
  persist();
  renderQuestion();
  $("stem").focus();
}

function markAnswer(letter) {
  if (attempt.finished !== null) return;
  if (Date.now() >= stopAt()) {
    finish(true);
    return;
  }
  attempt.answers[attempt.index] = letter;
  persist();
  updateNumbers();
}

function begin() {
  if (!attempt) {
    attempt = {
      started: Date.now(), finished: null, index: 0, answers: Array(questions.length).fill(null),
      flags: Array(questions.length).fill(false), sent: false, saveUncertain: false,
    };
    persist();
  }
  openTest();
  if (attempt.finished === null) $("stem").focus();
}

function finish(expired = false) {
  if (attempt.finished !== null) return;
  const now = Date.now();
  attempt.finished = Math.min(now, stopAt());
  attempt.expired = expired || now >= stopAt();
  persist();
  if ($("confirm").open) {
    $("confirm").returnValue = "back";
    $("confirm").close();
  }
  renderResults();
  if (linked) void sendResult();
}

function renderResults() {
  clearInterval(timer);
  $("clock").hidden = true;
  $("start").hidden = true;
  $("test").hidden = true;
  $("results").hidden = false;
  const result = stats();
  $("score").textContent = result.correct + " / " + questions.length;
  $("result-note").textContent = (attempt.expired ? "Time’s up. " : "") + result.answered + " answered · " + formatTime(elapsed());
  const table = document.createElement("table");
  const body = document.createElement("tbody");
  for (const [skill, score] of Object.entries(result.skills)) {
    const row = document.createElement("tr");
    const name = document.createElement("th");
    name.scope = "row";
    name.textContent = skill;
    const count = document.createElement("td");
    count.textContent = score.c + " / " + score.t;
    row.append(name, count);
    body.append(row);
  }
  table.setAttribute("aria-label", "Scores by skill");
  table.append(body);
  $("skills").replaceChildren(table);
  syncSendState();
  $("score").focus();
}

function elapsed() {
  return Math.ceil((attempt.finished - attempt.started) / 1000);
}

function readingPayload() {
  const result = stats();
  return {
    nameKey: student,
    paperId: config.paperId,
    score: result.correct, outOf: questions.length, timeUsedSec: elapsed(),
    perSkillJson: result.skills,
    answersJson: Object.fromEntries(attempt.answers.map((letter, index) => [index + 1, letter])),
    wrongJson: result.wrong,
  };
}

function syncSendState() {
  $("save-result").hidden = !linked || attempt.sent;
  $("save-result").disabled = sending;
  $("sent").textContent = attempt.sent ? "Saved to Gribbin." :
    sending ? "Saving…" : attempt.saveUncertain ? "Save unconfirmed. You can also download the result." : "";
}

async function callPortal(action, payload) {
  const response = await fetch(config.endpoint, {
    method: "POST", headers: {"Content-Type": "text/plain"}, redirect: "follow",
    signal: AbortSignal.timeout(20000),
    body: JSON.stringify({action, payload}),
  });
  if (!response.ok) throw Error("Save was not confirmed");
  const data = await response.json();
  if (!data.success) throw Error("Save was not confirmed");
  return data.data;
}

function hasResult(context) {
  return (context?.assignments || []).some((task) =>
    task.sourceId === config.paperId && String(task.status).toLowerCase() === "submitted"
  ) || (context?.readingHistory || []).some((result) => result.paperId === config.paperId);
}

async function sendResult() {
  if (!linked || attempt.finished === null || attempt.sent || sending) return;
  sending = true;
  syncSendState();
  try {
    const context = await callPortal("login", {name: student});
    if (!hasResult(context)) {
      const assigned = (context?.assignments || []).some((task) =>
        task.sourceId === config.paperId && task.type === "reading"
      );
      if (!assigned || !context.profile?.nameKey) throw Error("Assignment unavailable");
      await callPortal("submitReading", {...readingPayload(), nameKey: context.profile.nameKey});
    }
    attempt.sent = true;
    attempt.saveUncertain = false;
  } catch {
    attempt.saveUncertain = true;
  } finally {
    sending = false;
    persist();
    syncSendState();
  }
}

function downloadResult() {
  const result = readingPayload();
  const heading = config.title + "\n" + result.score + " / " + result.outOf + " · " + formatTime(result.timeUsedSec);
  const answers = questions.map((q, i) => (i + 1) + ". " + (attempt.answers[i] || "—") + "  (key " + q.answer + ")");
  const file = new Blob([[heading, "", ...answers].join("\n")], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = config.paperId + "-result.txt";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

letters.forEach((letter) => {
  const label = document.createElement("label");
  label.className = "option";
  const input = document.createElement("input");
  input.type = "radio";
  input.name = "answer";
  input.value = letter;
  input.addEventListener("change", () => markAnswer(letter));
  const name = document.createElement("strong");
  name.textContent = letter;
  const copy = document.createElement("span");
  label.append(input, name, copy);
  $("options").append(label);
  choices.push({label, input, copy});
});
const numberButtons = questions.map((_, index) => {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = String(index + 1);
  button.addEventListener("click", () => move(index));
  $("numbers").append(button);
  return button;
});

$("begin").addEventListener("click", begin);
$("previous").addEventListener("click", () => move(attempt.index - 1));
$("next").addEventListener("click", () => move(attempt.index + 1));
$("flag").addEventListener("click", () => {
  if (attempt.finished !== null) return;
  if (Date.now() >= stopAt()) return finish(true);
  attempt.flags[attempt.index] = !attempt.flags[attempt.index];
  persist();
  renderQuestion();
});
$("finish").addEventListener("click", () => {
  if (attempt.finished !== null) return renderResults();
  if (Date.now() >= stopAt()) return finish(true);
  const remaining = questions.length - stats().answered;
  $("confirm-note").textContent = remaining ? remaining + " unanswered." : "All questions answered.";
  $("confirm").returnValue = "back";
  $("confirm").showModal();
});
$("confirm").addEventListener("close", () => {
  if ($("confirm").returnValue === "submit") finish();
});
$("review").addEventListener("click", () => {
  openTest();
  $("stem").focus();
});
$("download").addEventListener("click", downloadResult);
$("save-result").addEventListener("click", sendResult);
if (linked) $("dashboard").href = "index.html?student=" + encodeURIComponent(student);

if (attempt?.finished != null) renderResults();
else if (attempt) {
  $("begin").textContent = "Resume test";
  if (Date.now() >= stopAt()) finish(true);
}
</script>
</body>
