<script id="testData" type="application/json">{"id": "persuasive-test-20261014", "version": 1, "title": "Persuasive writing test", "sections": [{"id": "1", "title": "Purpose and openings", "questionIds": [1, 2, 3, 4, 5, 6]}, {"id": "2", "title": "Testing arguments", "questionIds": [7, 8, 9, 10, 11, 12]}, {"id": "3", "title": "Evidence and believable claims", "questionIds": [13, 14, 15, 16, 17, 18]}, {"id": "4", "title": "Paragraphs and structure", "questionIds": [19, 20, 21, 22, 23, 24]}, {"id": "5", "title": "Persuasive language and speech voice", "questionIds": [25, 26, 27, 28, 29, 30]}, {"id": "6", "title": "Counterarguments and rebuttals", "questionIds": [31, 32, 33, 34, 35, 36]}, {"id": "7", "title": "Letters and public persuasive texts", "questionIds": [37, 38, 39, 40, 41, 42]}, {"id": "8", "title": "Sentence control and editing", "questionIds": [43, 44, 45, 46, 47, 48]}, {"id": "9", "title": "Diagnosing a complete draft", "questionIds": [49, 50, 51, 52, 53, 54], "passage": "Proposal: a four-week trial of voluntary lunchtime clubs using existing resources, subject to suitable supervision.\n\nDear Principal,\nImagine a world where no child can do anything. You must approve permanent clubs because everyone will become successful. Clubs are good because they are beneficial.\nFirstly, clubs help students make friends. My cousin enjoyed a club, which proves every lonely student will become popular straight away.\nSecondly, clubs help students meet new people. Famous chess players earn prize money, so this will improve everybody’s future career.\nSome teachers worry about extra supervision. That is false because clubs are fun. Students will do everything and teachers will have no work.\nEvery student must attend. Please replace lunchtime permanently. Thank you for listening."}, {"id": "10", "title": "Judgement and independent planning", "questionIds": [55, 56, 57, 58, 59, 60]}, {"id": "11", "title": "Speech", "questionIds": [61]}, {"id": "12", "title": "Letter", "questionIds": [62]}, {"id": "13", "title": "Persuasive text", "questionIds": [63]}], "questions": [{"n": 1, "kind": "mc", "marks": 1, "stimulus": "The local newsletter asks you to persuade residents that the library should stay open for one evening each week.", "prompt": "What kind of text does this task need?", "options": ["A letter asking the librarian to run another event.", "An argument for newsletter readers.", "A review of the previous event.", "A report of what happened at the event."]}, {"n": 2, "kind": "open", "marks": 4, "stimulus": "Write a letter to Ms Patel, the community centre manager, persuading her to approve a six-week Saturday board-game session for local families.", "prompt": "Who is this letter for? What do you want her to do? Name two letter features. What should the ending do?"}, {"n": 3, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence gives the writer’s opinion?", "options": ["Should the library open on Thursday evenings?", "Evening opening would help daytime workers.", "The library’s hours are a local issue.", "The library should trial Thursday evening opening."]}, {"n": 4, "kind": "open", "marks": 4, "stimulus": "Why should finishing work late mean losing the chance to borrow a book? Our library should trial one evening opening each week. It would give daytime workers a chance to visit and provide students with a quiet place to study after school.", "prompt": "Find the Hook, Opinion and Points. Why could the two points have separate paragraphs?"}, {"n": 5, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which opening makes the strongest case?", "options": ["A quiet room could give students somewhere to study after school. The library should trial evening opening.", "Without evening opening, children will stop reading. The hours must change.", "Successful people read, so evening opening will make the town successful.", "Books matter, so there is no reason to question longer hours."]}, {"n": 6, "kind": "open", "marks": 4, "stimulus": "Proposal: a four-week trial of voluntary lunchtime clubs.\nDraft: Imagine a world where nobody has any skills. Permanent compulsory clubs will stop this disaster. Everyone will become an excellent leader because clubs make people confident and improve confidence.", "prompt": "Write a better HOP introduction for this proposal. Give two different reasons."}, {"n": 7, "kind": "mc", "marks": 1, "stimulus": "A community hall is considering one monthly session where volunteers help residents repair simple household items.", "prompt": "Which reason best supports this proposal?", "options": ["Some people collect old tools.", "Factories can make many replacement items.", "A visitor could learn to fix an item instead of discarding it.", "Repair skills can be useful in paid work."]}, {"n": 8, "kind": "open", "marks": 4, "stimulus": "Proposal: voluntary lunchtime clubs.\nA. Clubs would be fun.\nB. Students would enjoy themselves.\nC. Students unable to attend an after-school club could try an activity at school.\nD. Four club sessions will turn every beginner into a national champion.", "prompt": "Keep, repair, merge or reject each reason. Explain your choices. Compare B with A."}, {"n": 9, "kind": "mc", "marks": 1, "stimulus": "Running a club would give student leaders practice in taking responsibility.", "prompt": "Which sentence explains how leaders practise responsibility?", "options": ["Leaders would prepare an activity, explain its steps and help beginners.", "Leadership matters because students will need it later.", "Clubs would offer a choice of indoor activities.", "Leaders would become responsible because their responsibility improves."]}, {"n": 10, "kind": "open", "marks": 4, "stimulus": "Claim: A voluntary lunchtime club could help a beginner become more confident about trying an unfamiliar activity.", "prompt": "Explain how a club could help a beginner’s confidence. Show the steps and why they matter."}, {"n": 11, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which pair gives two different reasons?", "options": ["Making friends; meeting new people.", "More confidence; less fear of an activity.", "Enjoying lunch; having more fun.", "Better access for beginners; explaining practice for leaders."]}, {"n": 12, "kind": "open", "marks": 4, "stimulus": "Every lonely student will immediately make friends if the school introduces clubs.", "prompt": "Find two weaknesses in this claim using the argument checks. Explain them, then rewrite it."}, {"n": 13, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which example supports the access argument?", "options": ["Who would want to miss a chance to learn?", "Access matters because students deserve it.", "This is the best proposal of the year.", "A student without an after-school lift could try chess at lunch."]}, {"n": 14, "kind": "open", "marks": 4, "stimulus": "For this question, a community centre surveys twenty visitors. Twelve say they would like to try a Saturday board-game session. The survey does not ask whether they are available on Saturdays.", "prompt": "What does the survey show? Give a limit of the sample, one thing it does not prove and a sensible next step."}, {"n": 15, "kind": "mc", "marks": 1, "stimulus": "The repair café’s busiest sessions received the most publicity. Its organisers conclude that quieter sessions must be less wanted and should be cancelled.", "prompt": "What is wrong with this conclusion?", "options": ["The attendance figures cannot be trusted.", "Publicity has no effect on attendance.", "Different publicity could explain the attendance gap.", "The centre should stop promoting all sessions."]}, {"n": 16, "kind": "open", "marks": 4, "stimulus": "Joey used to sit alone. After one club session he became popular with everyone. This proves clubs cure loneliness.", "prompt": "Rewrite this as an imagined example. Show how a shared activity might help someone make a connection."}, {"n": 17, "kind": "mc", "marks": 1, "stimulus": "My cousin enjoyed a club, so clubs help every student.", "prompt": "Which rewrite fixes the claim?", "options": ["My cousin enjoyed it, so almost everyone will benefit.", "My cousin’s experience shows one possible benefit, not a result for everyone.", "My cousin enjoyed it, and experts would probably agree.", "My cousin enjoyed it, so the school should copy that club exactly."]}, {"n": 18, "kind": "open", "marks": 4, "stimulus": "Research proves student-led clubs make children 90% more responsible.", "prompt": "Replace the invented research with a clear explanation. Why would changing 90% to most still be a problem?"}, {"n": 19, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which order builds the clearest body paragraph?", "options": ["Point, explanation, example, explain the example, link.", "Hook, new topic, conclusion, example, second reason.", "Example, statistic, point, greeting, explanation.", "Point, repeat the point, repeat it more firmly, slogan."]}, {"n": 20, "kind": "open", "marks": 4, "stimulus": "1. Evening opening would make borrowing more accessible to daytime workers.\n2. A later session would let them visit after finishing work.\n3. For example, someone who finishes at five could borrow a book during a six o’clock opening.\n4. That person would no longer need time off work simply to reach the library.\n5. This is a practical reason to test evening opening before making a permanent change.", "prompt": "Label the point, explanation, example, explanation of the example and link. What does sentence 4 add?"}, {"n": 21, "kind": "mc", "marks": 1, "stimulus": "Point: Leading a club can build communication skills.\nExample: A leader prepares instructions for a simple paper model and explains them to beginners.", "prompt": "Which sentence explains what the example shows?", "options": ["This is an excellent example of a good activity.", "Students could enjoy other activities too.", "Preparing and giving instructions makes the leader practise explaining clearly.", "The leader will therefore become a skilled teacher."]}, {"n": 22, "kind": "open", "marks": 4, "stimulus": "Clubs help beginners try activities. This means beginners can try things. For example, they can try things. Clubs are good.", "prompt": "Rewrite this paragraph. Develop one reason, give an example and link back to the proposal."}, {"n": 23, "kind": "mc", "marks": 1, "stimulus": "Paragraph reason: A school club can give beginners an accessible first attempt at an activity.", "prompt": "Which sentence does not belong in this access paragraph?", "options": ["A beginner could try one session before committing to more.", "Top chess players can win prizes overseas.", "School resources could save beginners from buying equipment.", "A lunchtime session could be easier to reach than an outside club."]}, {"n": 24, "kind": "open", "marks": 4, "stimulus": "A. A student without a lift to an outside chess club could use the school’s sets at lunch.\nB. Chess has been played for centuries.\nC. School clubs can remove practical barriers for beginners.\nD. Preparing instructions also gives club leaders communication practice.\nE. This is a reason to test a small, voluntary program.\nF. Sessions held on site do not require a second trip after school.\nG. The student could therefore try chess without needing extra transport or personal equipment.", "prompt": "Put five cards in paragraph order. Leave out two and explain why."}, {"n": 25, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence gives a firm recommendation without promising too much?", "options": ["The centre could consider a trial if it wants to.", "The trial will make every visitor confident.", "The trial must work because everyone likes board games.", "The centre should approve a trial, which could help newcomers join an activity."]}, {"n": 26, "kind": "open", "marks": 4, "stimulus": "Should a resident miss out simply because work ends after the library closes? The library would reopen at six o’clock, allowing someone who finishes work at five to visit.", "prompt": "Find an emotional appeal and a logical appeal. Explain each, then give a limit of each."}, {"n": 27, "kind": "mc", "marks": 1, "stimulus": "Give beginners a chance to try. Give leaders a chance to explain. Give the school a chance to test the idea.", "prompt": "What does the repetition add?", "options": ["It gives linked requests a rhythm listeners can follow.", "It proves the benefits have been measured.", "It removes the need to explain the requests.", "It guarantees agreement because there are three requests."]}, {"n": 28, "kind": "open", "marks": 4, "stimulus": "The school should try six weeks of voluntary paired reading. Younger readers would get practice and older students would practise explaining.", "prompt": "Turn this into a speech opening and ending for the principal, teachers and students."}, {"n": 29, "kind": "mc", "marks": 1, "stimulus": "Argument: Some students cannot attend an outside activity because transport after school is difficult.", "prompt": "Which question best supports the access argument?", "options": ["Why are opponents so selfish?", "Why should needing an after-school lift stop a beginner trying chess?", "Do you want children to fail because there are no clubs?", "If you like a quiet lunch, why do you dislike learning?"]}, {"n": 30, "kind": "open", "marks": 4, "stimulus": "A student’s speech to a school assembly: As adults, we know students may benefit from activities. Decision-makers should consider student benefit. Activities may provide opportunities. It should be considered.", "prompt": "Find two problems with this speech. Explain each and write a better version of the faulty part."}, {"n": 31, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence fairly acknowledges the concern?", "options": ["The concern comes from misunderstanding the proposal.", "Extra supervision means no trial is worth considering.", "Extra supervision could add work, so the trial needs workable staffing.", "The clubs’ benefits matter more than the workload concern."]}, {"n": 32, "kind": "open", "marks": 4, "stimulus": "Position: support a small voluntary club trial only if staffing is workable.\nA. Before approving the trial, the school should check staffing and start with one club only if it can be covered.\nB. Teachers are right to worry that an extra club could add to their supervision duties.\nC. This would let the school test the benefits without committing to an unstaffed program.\nD. The concern is strongest if many extra sessions are added without checking who can supervise them.", "prompt": "Put the rebuttal in order. Label Concede, Narrow, Answer and Link."}, {"n": 33, "kind": "mc", "marks": 1, "stimulus": "Objection: Extra lunchtime clubs could increase teachers’ workload.", "prompt": "Which sentence fairly narrows the concern?", "options": ["This only matters to teachers who dislike clubs.", "A short trial cannot create a real workload problem.", "Workload matters less if students want the clubs.", "The burden could be greater if several clubs need extra supervision at once."]}, {"n": 34, "kind": "open", "marks": 4, "stimulus": "Proposal: a small equipment-lending trial.\nObjection: Staff will need time to check returned equipment.\nWeak response: That is false because equipment helps families exercise.", "prompt": "Write a better rebuttal to the staff-time concern. Use Concede, Narrow, Answer and Link."}, {"n": 35, "kind": "mc", "marks": 1, "stimulus": "Proposal: voluntary clubs during part of one lunch each week.\nObjection: Clubs will take away every student’s chance to have an ordinary lunch break.", "prompt": "Which reply answers the objection without changing the proposal?", "options": ["Students can choose not to attend because the clubs are voluntary.", "Every student should attend for their own benefit.", "Learning should take priority over all lunch breaks.", "Losing a break is acceptable because clubs have benefits."]}, {"n": 36, "kind": "open", "marks": 4, "stimulus": "Proposal: a six-week Saturday board-game trial.\nObjection: People may say they are interested but stop attending after the first session.", "prompt": "Write a rebuttal defending the six-week trial. Use Concede, Narrow, Answer and Link."}, {"n": 37, "kind": "mc", "marks": 1, "stimulus": "Write a formal letter to Ms Patel asking for a Saturday board-game trial.", "prompt": "Which greeting and ending suit a formal letter?", "options": ["Fellow residents … Thank you for listening.", "Dear Ms Patel … Yours sincerely, Ehan.", "To whoever is in charge … Anyway, that is all.", "Board Games for Everyone … Please applaud the proposal."]}, {"n": 38, "kind": "open", "marks": 4, "stimulus": "Proposal: a six-week Saturday board-game trial.\nOpening: Hey everyone! Board games are the best.\nEnding: You know what to do. Please clap and thank you for listening.", "prompt": "Write a letter opening and ending to Ms Patel asking for a six-week trial."}, {"n": 39, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which statement about letters is correct?", "options": ["A date and address can replace a clear request.", "Persuasive letters must use informal language.", "A formal sign-off makes the whole letter suitable.", "The greeting and closing help, but the argument must suit the recipient too."]}, {"n": 40, "kind": "open", "marks": 4, "stimulus": "Dear Councillor Lee,\nI am writing to ask you to support a six-week trial of evening library opening. Daytime workers would have another opportunity to borrow books.\nPlease consider this trial.\nYours sincerely,\nEhan", "prompt": "Turn this into an article opening and ending for the local newsletter. Add a title and explain one form change."}, {"n": 41, "kind": "mc", "marks": 1, "stimulus": "Fellow students, today I support the club trial. Students would benefit from clubs. Students would gain skills. The decision-maker should consider this matter. That concludes the discussion.", "prompt": "What is the main problem with this speech?", "options": ["The greeting makes it a strong speech.", "Mentioning a decision-maker turns it into a letter.", "It starts as a speech but loses contact with its listeners.", "Practical concerns do not belong in speeches."]}, {"n": 42, "kind": "open", "marks": 4, "stimulus": "Recommendation: approve a four-week trial of voluntary lunchtime clubs.", "prompt": "Write this request as a speech sentence, a letter sentence and a website sentence. Explain one difference."}, {"n": 43, "kind": "mc", "marks": 1, "stimulus": "Donated equipment would avoid a purchase cost. ______ staff would still need time to check it after each loan.", "prompt": "Which word or phrase belongs in the gap?", "options": ["However", "Therefore", "For example", "Similarly"]}, {"n": 44, "kind": "open", "marks": 4, "stimulus": "The students needs is different, the school should keep the clubs voluntary.\nits a short trial, so the principal can review it.", "prompt": "Fix the grammar, punctuation and capitals. The first sentence refers to several students."}, {"n": 45, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence is most precise?", "options": ["The trial would benefit every part of students’ development.", "The trial gives beginners a first attempt without an extra trip.", "The trial would have a positive effect on the cognitive system.", "The trial should happen because it would be a good change."]}, {"n": 46, "kind": "open", "marks": 4, "stimulus": "YOU MUST APROVE THIS BECAUS ONLY A LAZY PRINCIPAL WOULD REJECT IT THE TRAIL WILL DEFINATELY MAKE ALL CHILDREN GENIUSES.", "prompt": "Rewrite this for a formal letter. Fix the errors and make it respectful and believable."}, {"n": 47, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence uses its and it’s correctly?", "options": ["Its important for the centre to check it’s staffing.", "It’s important for the centre to check it’s staffing.", "Its important for the centre to check its staffing.", "It’s important for the centre to check its staffing."]}, {"n": 48, "kind": "open", "marks": 4, "stimulus": "Older students help younger students when they read to them. This helps them because they get better. They will all become brilliant at everything, so it should happen.", "prompt": "Rewrite this so we know who does what. Explain one benefit without guaranteeing it."}, {"n": 49, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "How has the writer changed the proposal?", "options": ["The writer supports the exact trial.", "The writer rejects all clubs.", "The writer changes a voluntary trial into a permanent compulsory program.", "The writer only changes the topic from chess to friendship."]}, {"n": 50, "kind": "open", "marks": 4, "stimulus": "", "prompt": "Find four other weaknesses. Explain each. Do not repeat the changes identified in Question 49."}, {"n": 51, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which sentence best answers the supervision concern?", "options": ["Approve a small trial only if suitable supervision is available.", "Ignore supervision because friendship matters more.", "Student leaders remove the need for adult supervision.", "Existing equipment solves the staff-time problem."]}, {"n": 52, "kind": "open", "marks": 4, "stimulus": "", "prompt": "Write a new HOP introduction for the letter. Keep the exact proposal and give two different reasons."}, {"n": 53, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which new point is different from the friendship reason?", "options": ["Students could meet others and make more friends.", "Leaders would practise preparing materials and giving instructions.", "Students could socialise with people who share their interests.", "Lonely students could talk to someone and feel included."]}, {"n": 54, "kind": "open", "marks": 4, "stimulus": "", "prompt": "Write a better letter ending using your reasons from Question 52. Keep the four-week trial and supervision condition."}, {"n": 55, "kind": "mc", "marks": 1, "stimulus": "Should schools reward improvement more than high final results?", "prompt": "Which plan answers this question best?", "options": ["Reward only improvement and assume high scorers rely on talent.", "Praise learning and describe several school events.", "Explain how students can improve their marks.", "Support giving improvement more recognition than high results, explain why, and answer an objection."]}, {"n": 56, "kind": "open", "marks": 4, "stimulus": "A community centre is considering a six-week Saturday trial lending donated sports equipment to residents. Stock is limited and staff would need to check returns.", "prompt": "Plan an argument for this trial: your opinion, two different reasons with explanations, and an objection with a reply."}, {"n": 57, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "What is the best approach to a writing task?", "options": ["Reuse a memorised response with a new title.", "List reasons for most of the time, then write briefly.", "Read the task, plan distinct reasons, write and check.", "Start at once and rely on strong vocabulary."]}, {"n": 58, "kind": "open", "marks": 4, "stimulus": "Proposal: a six-week equipment-lending trial. The body develops access and reuse.\nConclusion: This will make us the best centre in the country. It will also attract thousands of tourists, which is another reason to start it.", "prompt": "Explain two faults in this ending, then rewrite it using the body’s reasons."}, {"n": 59, "kind": "mc", "marks": 1, "stimulus": "", "prompt": "Which statement about HOP and PEEL is correct?", "options": ["They are official labels required in every NSW response.", "They help with planning, but the writing must still answer the task.", "Every response needs three reasons and a survey.", "Every speech needs a question and equal-length sentences."]}, {"n": 60, "kind": "open", "marks": 4, "stimulus": "A. An evening opening could let a resident visit after work.\nB. Almost all families will attend the new Saturday session.\nC. The centre should check whether staff can supervise the trial before approving it.\nD. Anyone who prefers a quiet lunch clearly dislikes learning.", "prompt": "Keep, repair or remove each sentence. Explain your choices."}, {"n": 61, "kind": "writing", "marks": 25, "prompt": "Write a speech on whether schools should reward improvement more than high final results. You are a student speaking to the principal, teachers, parents and fellow students at an assembly.", "stimulus": ""}, {"n": 62, "kind": "writing", "marks": 25, "prompt": "Write a formal letter to Ms Patel, the community centre manager, arguing for or against this trial.", "stimulus": "The centre is considering a six-week Saturday trial lending donated sports equipment for one week at a time. Stock is limited. Staff would need to record loans and check returns."}, {"n": 63, "kind": "writing", "marks": 25, "prompt": "Write a persuasive text for the council website arguing for or against this proposal.", "stimulus": "The council wants to replace one parking space on each shopping street with a shaded public bench. Some residents want places to rest; others say parking is already scarce."}]}</script>
<script>
'use strict';
const TEST=JSON.parse(document.getElementById('testData').textContent);
const ANSWER_KEY={
  "1": "B",
  "3": "D",
  "5": "A",
  "7": "C",
  "9": "A",
  "11": "D",
  "13": "D",
  "15": "C",
  "17": "B",
  "19": "A",
  "21": "C",
  "23": "B",
  "25": "D",
  "27": "A",
  "29": "B",
  "31": "C",
  "33": "D",
  "35": "A",
  "37": "B",
  "39": "D",
  "41": "C",
  "43": "A",
  "45": "B",
  "47": "D",
  "49": "C",
  "51": "A",
  "53": "B",
  "55": "D",
  "57": "C",
  "59": "B"
};
const API_URL="https://script.google.com/macros/s/AKfycbyY7uCEPmhqsTrgaKwMR0M-i0X1nsDmov-HoxdnAlGEzDJMjZdhbgsOEjDwDaBETym_9g/exec";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
function readSession(){try{return localStorage.getItem('noof_student')||'';}catch(_){return '';}}
const studentKey=(params.get('student')||readSession()).trim().toLowerCase();
const STORAGE_KEY='noof_test_v1_'+encodeURIComponent(studentKey)+'_'+TEST.id;
let state=freshState(),submitting=false,storageOK=true;
function freshState(){return {version:TEST.version,answers:{},plans:{},section:0,submitted:false,score:null,updatedAt:0};}
function readProgress(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;
    const saved=JSON.parse(raw);
    if(!saved||saved.version!==TEST.version||typeof saved.answers!=='object'||Array.isArray(saved.answers))return null;
    const clean=freshState();
    for(const q of TEST.questions){
      const answer=saved.answers[q.n];
      if(typeof answer==='string'&&(q.kind!=='mc'||'ABCD'.includes(answer)&&answer.length===1))clean.answers[q.n]=answer;
      if(q.kind==='writing'&&saved.plans&&typeof saved.plans[q.n]==='string')clean.plans[q.n]=saved.plans[q.n];
    }
    clean.section=Number.isInteger(saved.section)&&saved.section>=0&&saved.section<TEST.sections.length?saved.section:0;
    clean.submitted=saved.submitted===true;clean.score=Number.isInteger(saved.score)&&saved.score>=0&&saved.score<=30?saved.score:null;
    clean.updatedAt=Number(saved.updatedAt)||0;return clean;
  }catch(_){return null;}
}
function saveProgress(){
  if(!studentKey)return false;
  state.updatedAt=Date.now();
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;
    $('saveStatus').className='save';
    $('saveStatus').textContent='Saved on this device';return true;
  }catch(_){
    storageOK=false;$('saveStatus').className='save error';
    $('saveStatus').textContent='Could not save on this device. Download a copy before leaving.';return false;
  }
}
function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function answered(q){return typeof state.answers[q.n]==='string'&&state.answers[q.n].trim().length>0;}
function scoreChoices(answers=state.answers){return Object.keys(ANSWER_KEY).reduce((n,id)=>n+(answers[id]===ANSWER_KEY[id]?1:0),0);}
function updateProgress(){
  const count=TEST.questions.filter(answered).length;$('answerCount').textContent=count+' of '+TEST.questions.length+' answered';$('progressBar').style.width=(count/TEST.questions.length*100)+'%';
  TEST.sections.forEach((s,i)=>{const done=s.questionIds.filter(n=>answered({n})).length;const el=$('section-'+i);if(el)el.querySelector('small').textContent=done+' / '+s.questionIds.length;});
}
function buildNavigation(){
  $('sectionNav').innerHTML=TEST.sections.map((s,i)=>'<button id="section-'+i+'" class="section-button" type="button" data-section="'+i+'">'+esc(s.title)+'<small></small></button>').join('');
  $('sectionSelect').innerHTML=TEST.sections.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(s.title)+'</option>').join('');
  $('sectionNav').addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(b)goSection(Number(b.dataset.section));});
}
function renderSection(){
  const section=TEST.sections[state.section];
  $('sectionIntro').innerHTML='<h2>'+esc(section.title)+'</h2>'+(state.section===0?'<p class="small">Choose one answer for each multiple-choice question. Write your own answers for the others. Use the facts given; do not invent research or statistics.</p>':'')+(section.passage?'<div class="stimulus">'+esc(section.passage)+'</div>':'');
  $('questions').innerHTML=section.questionIds.map(n=>{
    const q=TEST.questions.find(x=>x.n===n),value=state.answers[n]||'';
    const heading='<div class="question-heading"><h3 id="q-title-'+n+'">'+n+'. '+esc(q.prompt)+'</h3><span class="marks">'+q.marks+' '+(q.marks===1?'mark':'marks')+'</span></div>';
    const passage=q.stimulus?'<div class="stimulus">'+esc(q.stimulus)+'</div>':'';
    if(q.kind==='mc')return '<div class="question">'+heading+passage+'<fieldset aria-labelledby="q-title-'+n+'"><legend class="sr-only">Choose one answer</legend>'+q.options.map((opt,i)=>'<label class="option"><input type="radio" name="q-'+n+'" data-answer="'+n+'" value="'+'ABCD'[i]+'"'+(value==='ABCD'[i]?' checked':'')+(state.submitted||submitting?' disabled':'')+'><span><b>'+'ABCD'[i]+'.</b> '+esc(opt)+'</span></label>').join('')+'</fieldset></div>';
    const plan=q.kind==='writing'?'<label class="field-label" for="plan-'+n+'">Plan <span class="small">(not submitted)</span></label><textarea id="plan-'+n+'" class="plan" data-plan="'+n+'" spellcheck="false"'+(state.submitted||submitting?' disabled':'')+'>'+esc(state.plans[n]||'')+'</textarea><label class="field-label" for="answer-'+n+'">Your response</label>':'';
    return '<section class="question" aria-labelledby="q-title-'+n+'">'+heading+passage+plan+'<textarea id="answer-'+n+'" data-answer="'+n+'" aria-labelledby="q-title-'+n+'" class="'+(q.kind==='writing'?'long':'')+'" spellcheck="false"'+(state.submitted||submitting?' disabled':'')+'>'+esc(value)+'</textarea>'+(q.kind==='writing'?'<div id="words-'+n+'" class="word-count"></div>':'')+'</section>';
  }).join('');
  TEST.sections.forEach((_,i)=>{const el=$('section-'+i);if(i===state.section)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  $('sectionSelect').value=String(state.section);$('sectionPosition').textContent='Section '+(state.section+1)+' of '+TEST.sections.length;
  $('previousBtn').disabled=state.section===0||submitting;$('nextBtn').disabled=state.section===TEST.sections.length-1||submitting;
  $('submitBtn').disabled=state.submitted||submitting;$('submitBtn').textContent=state.submitted?'Submitted':submitting?'Submitting…':'Submit test';
  updateProgress();for(const n of section.questionIds)updateWordCount(n);
}
function updateWordCount(n){const el=$('words-'+n);if(el)el.textContent=(state.answers[n]||'').trim().split(/\s+/).filter(Boolean).length+' words';}
function goSection(index){if(submitting||index<0||index>=TEST.sections.length)return;state.section=index;saveProgress();renderSection();window.scrollTo({top:0,behavior:'auto'});}
function collectResponse(){
  const chunks=[TEST.title,'Multiple choice: '+scoreChoices()+' / 30','Written answers: awaiting tutor marking (195 marks)',''];
  for(const section of TEST.sections){
    const choices=section.questionIds.filter(id=>ANSWER_KEY[id]);
    const earned=choices.reduce((sum,id)=>sum+(state.answers[id]===ANSWER_KEY[id]?1:0),0);
    chunks.push(section.title+(choices.length?' (multiple choice '+earned+' / '+choices.length+')':''));
    if(section.passage)chunks.push(section.passage);
    for(const n of section.questionIds){
      const q=TEST.questions.find(x=>x.n===n),answer=state.answers[n]||'';
      chunks.push('Question '+n+' ('+q.marks+' marks): '+q.prompt);
      if(q.stimulus)chunks.push(q.stimulus);
      chunks.push('Answer:');
      if(q.kind==='mc')chunks.push(answer?answer+'. '+q.options['ABCD'.indexOf(answer)]:'Not answered');
      else chunks.push(answer.trim()||'Not answered');
    }
    chunks.push('');
  }
  return chunks.join('\n');
}
function responseWordCount(){return TEST.questions.filter(q=>q.kind!=='mc').reduce((sum,q)=>sum+(state.answers[q.n]||'').trim().split(/\s+/).filter(Boolean).length,0);}
async function callBackend(action,payload){
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);
  try{
    const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,payload}),redirect:'follow',signal:controller.signal});
    const raw=await response.text();let result;
    try{result=JSON.parse(raw);}catch(_){throw new Error('The server did not confirm the submission.');}
    if(!result.success)throw new Error(result.error||'The request failed.');return result.data;
  }finally{clearTimeout(timeout);}
}
async function checkSubmission(){
  const context=await callBackend('login',{name:studentKey});
  if(context.profile&&context.profile.displayName){$('studentName').textContent=context.profile.displayName;$('studentDivider').hidden=false;}
  return (context.assignments||[]).some(t=>String(t.sourceId)===TEST.id&&String(t.status).toLowerCase()==='submitted');
}
function showSubmitted(knownScore){
  state.submitted=true;state.score=knownScore;saveProgress();renderSection();
  $('submitStatus').className='status';$('submitStatus').textContent='Submitted to your tutor.';
  $('result').hidden=false;$('result').innerHTML=(knownScore==null?'':'<p><strong>Multiple choice: '+knownScore+' / 30</strong></p>')+'<p class="small">Your tutor will mark the written answers.</p>';
  $('portalLink').href='index.html?student='+encodeURIComponent(studentKey)+'&done=test';
}
async function submitTest(){
  if(submitting||state.submitted)return;
  const missing=TEST.questions.filter(q=>!answered(q)).length;
  if(missing&&!window.confirm(missing+' questions are unanswered. Submit anyway?'))return;
  if(!missing&&!window.confirm('Submit your test to your tutor?'))return;
  saveProgress();submitting=true;renderSection();$('submitStatus').className='status';$('submitStatus').textContent='Submitting…';
  try{
    if(await checkSubmission()){showSubmitted(state.score);return;}
    const responseText=collectResponse();
    await callBackend('submitWriting',{nameKey:studentKey,promptId:TEST.id,promptTitle:TEST.title,wordCount:responseWordCount(),timeUsedSec:0,responseText});
    showSubmitted(scoreChoices());
  }catch(error){
    let confirmed=false;try{confirmed=await checkSubmission();}catch(_){}
    if(confirmed)showSubmitted(scoreChoices());
    else{$('submitStatus').className='status error';$('submitStatus').textContent='Submission was not confirmed. Your answers are still here. Check your connection and try again.';}
  }finally{submitting=false;renderSection();}
}
function downloadAnswers(){
  const text=collectResponse();const file=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='persuasive-test-'+studentKey+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('questions').addEventListener('input',e=>{
  if(state.submitted||submitting)return;
  if(e.target.dataset.answer){state.answers[e.target.dataset.answer]=e.target.value;updateWordCount(Number(e.target.dataset.answer));updateProgress();saveProgress();}
  if(e.target.dataset.plan){state.plans[e.target.dataset.plan]=e.target.value;saveProgress();}
});
$('questions').addEventListener('change',e=>{if(e.target.type==='radio'&&!state.submitted&&!submitting){state.answers[e.target.dataset.answer]=e.target.value;updateProgress();saveProgress();}});
$('previousBtn').addEventListener('click',()=>goSection(state.section-1));$('nextBtn').addEventListener('click',()=>goSection(state.section+1));$('sectionSelect').addEventListener('change',e=>goSection(Number(e.target.value)));$('submitBtn').addEventListener('click',submitTest);$('downloadBtn').addEventListener('click',downloadAnswers);
window.addEventListener('pagehide',saveProgress);window.addEventListener('beforeunload',e=>{saveProgress();if(!storageOK&&!state.submitted){e.preventDefault();e.returnValue='';}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveProgress();});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&!submitting){const incoming=readProgress();if(incoming&&incoming.updatedAt>=state.updatedAt){state=incoming;if(incoming.submitted)showSubmitted(incoming.score);else{renderSection();$('saveStatus').textContent='Saved answers updated from another tab';}}}});
async function init(){
  if(!studentKey){$('missingStudent').hidden=false;return;}
  $('studentName').textContent=studentKey;$('studentDivider').hidden=false;$('portalLink').href='index.html?student='+encodeURIComponent(studentKey);$('testApp').hidden=false;
  const restored=readProgress();if(restored)state=restored;buildNavigation();renderSection();
  if(restored)$('saveStatus').textContent='Saved answers restored';
  if(state.submitted){showSubmitted(state.score);return;}
  try{if(await checkSubmission())showSubmitted(null);}
  catch(_){$('connectionStatus').hidden=false;$('connectionStatus').textContent='The server is unavailable. You can keep working and submit when it reconnects.';}
}
init();
</script>
