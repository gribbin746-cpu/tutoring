<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --navy: #102e4b;
  --navy-ink: #10283f;
  --blue: #245b8a;
  --blue-2: #214d76;
  --bg: #f4f6f8;
  --ink: #182938;
  --muted: #536476;
  --border: #d6e0e8;
  --line: #e7edf2;
  --soft: #edf3f8;
  --gold: #ac863a;
  --gold-soft: #faf1dc;
  --ok: #226543;
  --ok-bg: #eaf4ed;
  --warn: #805318;
  --warn-bg: #fbf1df;
  --err: #9c312d;
  --err-bg: #faecea;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: Georgia, "Times New Roman", serif;
  --read: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
.hidden, [hidden] { display: none !important; }
:focus-visible { outline: 3px solid #926914; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { color: var(--navy-ink); line-height: 1.22; }
h1 { font: 600 clamp(1.9rem, 4vw, 2.55rem)/1.15 var(--display); letter-spacing: -.025em; }
h2 { font: 600 1.45rem/1.2 var(--display); }
h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .58; }
summary { cursor: pointer; }
small { color: var(--muted); font-size: .8em; font-weight: 500; }
label { display: block; color: var(--navy-ink); font-size: .86rem; font-weight: 680; margin-bottom: 5px; }
input:not([type=checkbox]), select, textarea {
  width: 100%; min-width: 0; min-height: 42px; padding: 8px 10px; border: 1px solid #b9c7d3;
  border-radius: 7px; background: #fff; color: var(--ink);
}
input[type=checkbox] { accent-color: var(--navy); width: 16px; height: 16px; margin: 0; flex: none; }
textarea { display: block; resize: vertical; }
a, .linkbtn { color: var(--blue-2); text-underline-offset: 3px; }
.masthead { background: var(--navy); color: #fff; border-bottom: 2px solid var(--gold); }
.masthead-inner { min-height: 57px; margin: auto; max-width: 1296px; padding: 0 22px; display: flex; gap: 18px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; font: 600 1.2rem var(--display); }
.logo { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #bda16a; border-radius: 6px; color: #f5e8c7; }
.hstatus { color: #ffdbd5; display: flex; gap: 6px; align-items: center; font-size: .8rem; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #ff9a8c; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
.wrap[data-view="vAdmin"] { max-width: 1296px; }
.wrap[data-view="vWriting"] { max-width: 920px; }
.card { min-width: 0; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: clamp(15px, 2.3vw, 25px); }
.card + .card { margin-top: 14px; }
.auth-card { max-width: 445px; margin: clamp(12px, 7vh, 74px) auto 0; padding: clamp(21px, 4vw, 33px); border-top: 3px solid var(--gold); }
.auth-card h1 { margin-bottom: 20px; }
.auth-actions { margin-top: 12px; }
.auth-actions .btn { width: 100%; }
.auth-footer { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 14px; border: 1px solid var(--navy); border-radius: 7px; background: var(--navy); color: #fff; font-size: .91rem; font-weight: 680; line-height: 1.25; }
.btn:hover:enabled { background: #235178; }
.btn.ghost { border-color: var(--border); background: #fff; color: var(--navy-ink); }
.btn.ghost:hover:enabled { background: var(--soft); }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: .86rem; }
.btn.tiny { min-height: 34px; padding: 5px 10px; font-size: .82rem; }
.linkbtn { min-height: 32px; padding: 3px 0; border: 0; background: none; font-size: .88rem; font-weight: 650; }
.linkbtn:hover { text-decoration: underline; }
.row, .page-heading, .panel-heading, .writing-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.page-heading, .panel-heading, .writing-top { justify-content: space-between; }
.page-heading { margin-bottom: 14px; }
.panel-heading { gap: 8px 16px; }
.page-meta, .aitemmeta, .emptyline, .sub { color: var(--muted); font-size: .86rem; }
.page-meta { margin-top: 4px; }
.emptyline { padding-block: 13px; }
.msg { margin: 10px 0; padding: 8px 11px; border-radius: 6px; background: var(--soft); color: var(--navy); font-size: .88rem; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.err { background: var(--err-bg); color: var(--err); }
.spin { flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.section-nav { display: flex; flex-wrap: wrap; gap: 3px 12px; border-bottom: 1px solid var(--border); margin: 0 0 14px; }
.section-nav button { display: flex; gap: 6px; align-items: center; min-height: 42px; padding: 7px 6px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 650; font-size: .9rem; }
.section-nav button:hover { color: var(--navy); }
.section-nav button[aria-current] { border-bottom-color: var(--gold); color: var(--navy); }
.count, .pill { display: inline-block; min-width: 21px; padding: 1px 6px; border-radius: 5px; background: var(--soft); color: var(--navy); text-align: center; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.pill.pending { color: var(--warn); background: var(--warn-bg); }
.pill.sent { color: var(--ok); background: var(--ok-bg); }
.student-panel h2 { margin-bottom: 8px; }
.task { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tasklist > .task:last-child, .completed .task:last-child { border-bottom: 0; }
.ticon { width: 35px; height: 35px; flex: none; display: grid; place-items: center; border-radius: 7px; background: var(--soft); color: var(--blue-2); }
.ticon svg { width: 18px; height: 18px; }
.tmid { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ttitle { font-weight: 680; }
.tmeta { color: var(--muted); font-size: .8rem; }
.due.overdue { color: var(--err); }
.due.soon { color: var(--warn); }
.completed { margin-top: 12px; }
.completed > summary { padding-block: 8px; color: var(--navy); font-weight: 650; }
.completed .task { padding-block: 9px; }
.fb, .rev, .record { border-top: 1px solid var(--line); }
.fb summary, .rev summary { display: flex; align-items: center; gap: 10px; padding: 11px 0; list-style: none; }
.fb summary::-webkit-details-marker, .rev summary::-webkit-details-marker { display: none; }
.fbtitle { flex: 1; font-weight: 680; min-width: 0; overflow-wrap: anywhere; }
.fbbody, .revbody { padding: 0 0 13px; }
.chev { flex: none; margin-left: auto; color: var(--muted); }
[open] > summary .chev { transform: rotate(90deg); }
.fbblock { background: #f8fafc; border-left: 2px solid var(--gold); padding: 10px 13px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.words, .vault { display: flex; gap: 6px; flex-wrap: wrap; }
.word { display: inline-block; padding: 3px 8px; background: var(--gold-soft); color: var(--warn); border-radius: 4px; }
.score { color: var(--navy); font-weight: 700; white-space: nowrap; }
.skillrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; font-size: .9rem; }
.bar { margin-top: 4px; height: 5px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); }
.autopsy { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: .83rem; }
.autopsy th, .autopsy td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px; overflow-wrap: anywhere; }
.autopsy th { color: var(--muted); }
.autopsy .corr { color: var(--ok); }
.autopsy .pick { color: var(--err); }
.asection, .eyebrow { color: var(--navy); font-size: .89rem; font-weight: 700; margin: 12px 0 6px; }
.writing-top { position: sticky; top: 0; z-index: 1; margin: -5px 0 11px; padding: 5px 0 8px; background: #fff; border-bottom: 1px solid var(--line); }
.writing-card h1 { margin: 4px 0 14px; }
.wbar { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock { font-weight: 750; color: var(--navy); }
.clock.warn { color: var(--err); }
.prompt { background: #f8fafc; border-left: 2px solid var(--gold); padding: 11px 14px; margin: 0 0 14px; font: 1.08rem/1.55 var(--read); }
.prompt p + p { margin-top: 8px; }
.prompt:empty { display: none; }
.plan { margin-bottom: 12px; }
.plan summary { font-weight: 650; color: var(--navy); padding-block: 6px; }
.plan summary .page-meta { margin-left: 5px; font-weight: 400; }
#wPlan { min-height: 96px; }
#wText { min-height: 290px; font: 1.1rem/1.65 var(--read); }
.write-actions { margin-top: 12px; }
.console-layout { display: grid; grid-template-columns: minmax(180px, 222px) minmax(0, 1fr); gap: 14px; align-items: start; }
.roster { position: sticky; top: 12px; padding: 13px; }
.roster-list { display: grid; gap: 3px; margin-top: 9px; max-height: min(62vh, 560px); overflow: auto; }
.roster-choice { width: 100%; min-height: 36px; border: 0; border-radius: 6px; padding: 6px 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 5px; color: var(--ink); background: transparent; font-size: .87rem; overflow-wrap: anywhere; }
.roster-choice[aria-current] { color: var(--navy); background: var(--soft); font-weight: 720; box-shadow: inset 2px 0 var(--gold); }
.roster-choice:hover { background: var(--soft); }
.roster-choice .count { background: var(--gold-soft); color: var(--warn); }
.console-work { min-width: 0; }
.console-card .panel-heading { margin-bottom: 10px; }
.admin-nav { margin-bottom: 9px; }
.admin-filters { display: grid; grid-template-columns: minmax(155px, 1fr) minmax(116px, .55fr) minmax(122px, .60fr); gap: 9px; margin-bottom: 10px; }
.admin-filters input, .admin-filters select, .roster input { font-size: .9rem; min-height: 38px; }
.record { padding: 11px 0; }
.record-top, .record-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; }
.record-top { flex-wrap: wrap; }
.record-title { font-weight: 690; overflow-wrap: anywhere; }
.record-meta { color: var(--muted); font-size: .82rem; margin-top: 2px; overflow-wrap: anywhere; }
.record-actions { justify-content: flex-end; flex-wrap: wrap; }
.record details { margin-top: 7px; }
.record details summary { color: var(--blue-2); font-size: .85rem; }
.record .table-wrap { overflow-x: auto; }
.record .table-wrap th:last-child, .record .table-wrap td:last-child { min-width: 65px; }
#adminReadingSkills { margin: 9px 0; }
#adminReadingSkills details { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
#adminReadingSkills summary { font-weight: 650; color: var(--navy); }
.editor-title { margin: 8px 0 3px; }
.editor-grid { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, 1fr); gap: 16px; margin-top: 13px; align-items: start; }
.editor-controls label + input { margin-bottom: 6px; }
.editor-controls textarea { min-height: 105px; margin-bottom: 10px; }
.draftsurface, .annotdraft { background: #f8fafc; border: 1px solid var(--line); border-radius: 7px; padding: 11px 13px; white-space: pre-wrap; overflow-wrap: anywhere; font: 1.04rem/1.62 var(--read); }
.draftsurface { max-height: min(59vh, 570px); overflow: auto; }
.cmark { background: #f6e6aa; color: inherit; }
.cmtlist, .annotnotes { margin-top: 8px; }
.cmtitem, .annotnotes li { display: flex; gap: 7px; align-items: flex-start; padding: 5px 0; font-size: .85rem; }
.annotnotes { list-style: none; padding-left: 0; }
.cmtbody { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cmtq { color: var(--muted); }
.cmnum { flex: none; font-size: .77rem; font-weight: 700; padding: 1px 6px; background: var(--gold-soft); color: var(--warn); border-radius: 4px; }
.scorewrap { border-top: 1px solid var(--line); padding-top: 8px; }
.scoresetname { font-size: .83rem; font-weight: 720; margin: 8px 0 4px; }
.scorerow2 { display: grid; grid-template-columns: minmax(0,1fr) 56px auto; align-items: center; gap: 6px; font-size: .83rem; margin-bottom: 4px; }
.scorerow2 select { min-height: 31px; padding: 3px 4px; }
.scoretotal { margin-top: 8px; font-weight: 700; }
.marking-notes, .testnotes, .rubric-toggle { margin-top: 8px; }
.scorecard { background: var(--soft); border-radius: 7px; padding: 9px 12px; margin-bottom: 7px; }
.scorecardtop, .screv { display:flex; justify-content:space-between; gap: 8px; }
.scorecardtot { font-weight: 750; }
.screvs { font-size: .84rem; }
.revopt { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-weight: 540; }
.revopt input[type=number] { width: 57px; min-height: 31px; padding: 3px 5px; }
.pushrow { margin-top: 9px; }
dialog { width: min(540px, calc(100% - 22px)); padding: 18px; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); }
dialog::backdrop { background: #12283999; }
.assignbox { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin-top: 10px; }
.assign-details { margin-top: 12px; }
.assign-details summary { color: var(--navy); font-weight: 670; }
.assign-link { grid-column: 1/-1; }
.cmtpop { position: absolute; z-index: 4; background: #fff; border: 1px solid var(--border); border-top: 2px solid var(--gold); border-radius: 7px; padding: 9px; box-shadow: 0 6px 20px #142e4630; }
.cmtpop textarea { min-height: 65px; }
.cmtpopq { color: var(--muted); font-size: .83rem; overflow-wrap: anywhere; }
.cmtpopbtns { display: flex; gap: 6px; margin-top: 6px; }
.toast { position: fixed; z-index: 5; left: 50%; bottom: 20px; transform: translateX(-50%); display: none; max-width: calc(100% - 24px); padding: 8px 13px; border-radius: 7px; background: var(--navy); color: #fff; font-size: .88rem; }
.toast.show { display: block; }
@media (max-width: 760px) {
  .wrap { padding: 18px 13px 35px; }
  .masthead-inner { padding-inline: 13px; }
  .console-layout, .editor-grid { grid-template-columns: 1fr; }
  .roster { position: static; }
  .roster-list { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); max-height: 125px; }
  .draftsurface { max-height: 420px; }
}
@media (max-width: 500px) {
  .admin-filters { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .admin-filters > div:first-child { grid-column: 1/-1; }
  .section-nav { column-gap: 7px; }
  .section-nav button { padding-inline: 4px; font-size: .85rem; }
  .task { gap: 7px; }
  .ticon { width: 28px; height: 28px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
/* Noof palette and type */
:root {
  --navy: #0a2a4e;
  --navy-ink: #0a2540;
  --blue: #1f6fc9;
  --blue-2: #0e4f9e;
  --bg: #eef1f7;
  --ink: #16202c;
  --muted: #546275;
  --border: #dbe3ed;
  --line: #e9eef5;
  --soft: #ebf2fb;
  --gold: #b0892f;
  --gold-soft: #f4ecd7;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --lift: 0 1px 2px #0a254009, 0 17px 32px -22px #1535574f;
}
body {
  background: radial-gradient(ellipse 850px 400px at 35% 0%, #eaf1fb, transparent),
    linear-gradient(180deg, #f0f3f9, #e8edf5) fixed;
}
.masthead {
  position: relative;
  border-bottom: 0;
  background: linear-gradient(115deg, #06203f, #0a2f5c 57%, #11447f);
  box-shadow: 0 10px 23px -17px #06203fb3;
}
.masthead::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #b0892fab 22%, #b0892f 51%, #b0892fab 78%, transparent);
}
.masthead-inner { min-height: 63px; }
.brand { gap: 11px; font-size: 1.3rem; }
.logo {
  width: 37px; height: 37px; border-radius: 10px; color: #fff; border-color: #ffffff47;
  background: linear-gradient(148deg, #1b5db0, #0a2f5c);
  box-shadow: inset 0 1px #ffffff36;
}
.wrap { padding-top: 33px; }
.card { border-radius: 17px; box-shadow: var(--lift); }
.auth-card { border-top-color: var(--gold); }
.student-signin, .dashboard-hero {
  background: radial-gradient(ellipse 420px 240px at 100% 0%, #2b61a070, transparent),
    linear-gradient(115deg, #081f3d, #0b3569 100%);
  border: 1px solid #193f6b;
  color: #fff;
}
.student-signin { border-top: 3px solid #bd974a; }
.student-signin h1, .student-signin label, .dashboard-hero h1 { color: #fff; }
.student-signin .auth-footer { border-color: #ffffff39; }
.student-signin .linkbtn { color: #dceafc; }
.student-signin .btn { background: #fff; border-color: #fff; color: var(--navy); }
.student-signin .btn:hover:enabled { background: #eaf1fb; }
.student-signin :focus-visible, .dashboard-hero :focus-visible { outline-color: #e3c374; }
.btn {
  border-radius: 9px;
  background: linear-gradient(145deg, #174d83, #0a2f5c);
  box-shadow: 0 2px 7px -4px #0a2f5c6b;
}
.btn:hover:enabled { background: linear-gradient(145deg, #235c94, #113c65); }
.btn.ghost { box-shadow: none; }
.section-nav { column-gap: 18px; padding-inline: 5px; }
.section-nav button { padding-inline: 7px; }
.section-nav button[aria-current] { color: var(--navy); border-color: var(--gold); }
.count { background: #e5edf9; border-radius: 99px; padding-inline: 7px; }

/* Student dashboard */
.dashboard-hero { margin-bottom: 16px; padding: clamp(18px, 3vw, 29px); }
.dashboard-hero .page-heading { margin: 0 0 16px; }
.dashboard-hero .page-heading h1 { font-size: clamp(2.1rem, 5vw, 3rem); }
.dashboard-hero #dashYear { color: #f6e6c1; font-size: .85rem; }
.dashboard-hero .btn.ghost {
  background: #ffffff0d; border-color: #b6ccec7a; color: #fff;
}
.dashboard-hero .btn.ghost:hover:enabled { background: #ffffff26; }
.dashboard-stats {
  display: grid; grid-template-columns: repeat(auto-fit,minmax(128px,1fr)); gap: 9px 15px;
  border-top: 1px solid #ffffff26; padding-top: 13px;
}
.dashboard-stats > * {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  min-height: 58px; border: 0; border-left: 2px solid #c29b4b; padding: 3px 0 3px 12px;
  text-align: left; color: #fff; background: none;
}
.dashboard-stats button:hover { background: #ffffff0f; }
.dashboard-stats strong { font: 600 1.58rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.dashboard-stats span { margin-top: 4px; color: #e0eafa; font-size: .79rem; }
.task-panel-heading { margin-bottom: 8px; }
.task-panel-heading h2 { margin: 0; }
.task-panel-heading select { width: auto; min-width: 120px; min-height: 36px; font-size: .87rem; }
.tasklist { display: grid; gap: 7px; }
.task, .tasklist > .task:last-child, .completed .task:last-child {
  border: 1px solid var(--border); border-left: 3px solid #638fbe; border-radius: 10px; padding: 9px 11px;
}
.task.overdue { border-left-color: #b74e47; }
.task.soon { border-left-color: #b0892f; }
.task.done { border-left-color: #75a68a; background: #fafcfb; }
.task .ticon { border: 1px solid #d9e6f5; background: linear-gradient(145deg,#f0f6ff,#e0ecf9); }
.task .ticon svg { width: 17px; height: 17px; }
.completed { margin-top: 3px; }
.completed .task { margin-top: 6px; }

/* Tutor console */
.console-heading { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.console-heading h1 { border-left: 3px solid var(--gold); padding-left: 11px; }
.roster { padding: 12px; }
.roster-choice { border-radius: 8px; }
.roster-choice[aria-current] { background: #e9f0fa; }
.console-card .panel-heading { margin-bottom: 6px; }
.list-controls {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 7px;
}
.list-controls:has(#recordCount:empty):has(#markNext[hidden]) { display: none; }
.list-pagination, .editor-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.list-pagination { padding-top: 10px; border-top: 1px solid var(--line); }
.editor-nav { padding-block: 3px 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.record { padding-block: 12px; }
.record:hover { background: #f9fbfe; }
.draftsurface, .annotdraft { background: #f7f9fd; border-color: #e0e8f2; }

const PROOFREADING_KEY = [["Missing commas", "river a dark", "river, a dark", "Put a comma after the opening dependent clause."], ["Apostrophes", "Moles eye", "Mole’s eye", "The eye belongs to Mole."], ["Comma splices", "make, something", "make. Something", "Separate the two complete clauses with a full stop, semicolon or suitable conjunction. A comma alone cannot join them."], ["Grammar", "The two animals was", "The two animals were", "The plural subject animals takes were."], ["Spelling", "cautiosly", "cautiously", "Keep the -tious- spelling."], ["Other punctuation", "come over.", "come over?", "A direct question needs a question mark inside the quotation marks."], ["Spelling", "unfastend", "unfastened", "The past tense is unfastened."], ["Spelling", "steped", "stepped", "Double the final p before -ed."], ["Comma splices", "outside, it", "outside. It", "Both clauses can stand alone. A semicolon or a suitable conjunction is also valid."], ["Grammar", "The boat were", "The boat was", "The singular subject boat takes was."], ["Apostrophes", "two animal’s / two animal's", "two animals", "A plural does not take an apostrophe here."], ["Missing commas", "bank he", "bank, he", "Close the opening When clause with a comma."], ["Missing commas", "down he", "down, he", "Close the opening As clause with a comma."], ["Spelling", "wonderfull", "wonderful", "Wonderful ends in one l."], ["Apostrophes", "Ive", "I’ve", "The apostrophe stands for the missing ha in I have."], ["Spelling", "fasinating", "fascinating", "Fascinating contains sc."], ["Missing commas", "nervous he", "nervous, he", "Close the opening Although clause with a comma."], ["Grammar", "hisself", "himself", "Use the reflexive pronoun himself."], ["Other punctuation", "Look ahead Rat", "Look ahead, Rat", "Set off the name of the person being addressed."], ["Spelling", "sudenly", "suddenly", "Suddenly contains dd."], ["Comma splices", "late, the boat", "late. The boat", "Separate the two complete clauses. Accept a semicolon or a suitable conjunction."], ["Grammar", "His feet was", "His feet were", "The plural subject feet takes were."]];
function drillMarkingNotes(promptId){
  if(String(promptId)===PROOFREADING_DRILL_ID){
    return '<details class="aitem" style="margin-top:12px"><summary>Proofreading key · 22 corrections</summary><p class="aitemmeta">Award one mark per target repaired. Accept full stops, semicolons and suitable conjunctions for comma splices, and either straight or curly apostrophes. Do not require an exact text match or penalise valid changes in wording. Read the whole passage for errors introduced by an attempted repair. The task is adapted from Kenneth Grahame, The Wind in the Willows, Chapter 1.</p><ol>'+PROOFREADING_KEY.map(x=>'<li><b>'+esc(x[1])+' → '+esc(x[2])+'</b><p class="aitemmeta">'+esc(x[3])+'</p></li>').join('')+'</ol></details>';
  }
  if(String(promptId)===PEEL_DRILL_ID){
    return '<details class="aitem" style="margin-top:12px"><summary>PEEL marking guide · 10 per paragraph</summary><p class="aitemmeta">Point (2): focused reason and a clear position. Explanation (3): develops a believable causal link rather than restating the point. Example (3): a specific, plausible case that supports the reason; an invented study earns no credit as evidence. Link (1): returns to the position without adding a different argument. Control (1): readable, accurate sentences. Accept either position and a valid variation in paragraph order. Timings and the draft captured after five minutes appear in the submission. Overtime carries no automatic penalty.</p></details>';
  }
  return '';
}

function criteriaFlat(schema=WRITING_CRITERIA){return Object.values(schema).flat();}
function criteriaMaxTotal(schema=WRITING_CRITERIA){return criteriaFlat(schema).reduce((s,c)=>s+c.max,0);}
function criteriaLabel(key){const c=criteriaFlat().concat(criteriaFlat(PERSUASIVE_CRITERIA),criteriaFlat(PROOFREADING_CRITERIA),criteriaFlat(PEEL_CRITERIA)).find(c=>c.key===key);const paragraph=String(key).match(/^peel_(\d+)_/);return c?((paragraph?"Paragraph "+paragraph[1]+": ":"")+c.label):key;}

/* admin: build the score editor under a draft */
function scoreEditor(bid,existing,promptId,responseText){
  const isTest=String(promptId)===PERSUASIVE_TEST_ID;
  const schema=isTest?PERSUASIVE_CRITERIA:String(promptId)===PROOFREADING_DRILL_ID?PROOFREADING_CRITERIA:String(promptId)===PEEL_DRILL_ID?PEEL_CRITERIA:WRITING_CRITERIA;adminScoreSchemas[bid]=schema;
  const sc={...((existing&&existing.scores)||{})};
  if(isTest&&sc.test_mcq==null){const match=String(responseText||"").match(/^Multiple choice: (\d+) \/ 30$/m);if(match&&Number(match[1])<=30)sc.test_mcq=Number(match[1]);}
  let html='<div class="scorewrap"><label>'+(isTest?'Persuasive test score':String(promptId)===PROOFREADING_DRILL_ID?'Proofreading score':String(promptId)===PEEL_DRILL_ID?'PEEL practice score':'Selective score')+'</label>';
  Object.keys(schema).forEach(setName=>{
    html+='<div class="scoreset"><div class="scoresetname">'+esc(setName)+'</div>';
    schema[setName].forEach(c=>{
      let opts='<option value="">\u2013</option>';
      for(let i=0;i<=c.max;i++){ opts+='<option value="'+i+'"'+(String(sc[c.key])===String(i)?' selected':'')+'>'+i+'</option>'; }
      html+='<div class="scorerow2"><span>'+esc(c.label)+'</span>'+
        '<select aria-label="'+escAttr(c.label)+'" id="sc-'+bid+'-'+c.key+'" onchange="recalcScore(\''+bid+'\')">'+opts+'</select>'+
        '<small>/ '+c.max+'</small></div>';
    });
    html+='</div>';
  });
  const initTotal=criteriaFlat(schema).reduce((sum,c)=>sum+(Number(sc[c.key])||0),0);
  html+='<div class="scoretotal">Total <b id="tot-'+bid+'">'+initTotal+'</b> / '+criteriaMaxTotal(schema)+'</div></div>';
  if(isTest)html+=testMarkingNotes();
  html+=drillMarkingNotes(promptId);
  return html;
}
function recalcScore(bid){
  let total=0, any=false;
  criteriaFlat(adminScoreSchemas[bid]||WRITING_CRITERIA).forEach(c=>{ const el=document.getElementById('sc-'+bid+'-'+c.key);
    if(el&&el.value!==''){ total+=Number(el.value); any=true; } });
  document.getElementById('tot-'+bid).textContent=any?total:0;
}
function gatherScore(bid){
  const scores={}; let total=0, any=false; const schema=adminScoreSchemas[bid]||WRITING_CRITERIA; const max=criteriaMaxTotal(schema);
  criteriaFlat(schema).forEach(c=>{ const el=document.getElementById('sc-'+bid+'-'+c.key);
    if(el&&el.value!==''){ scores[c.key]=Number(el.value); total+=Number(el.value); any=true; } });
  return any? {scores,total,max} : null;
}
/* student: render a pushed score */
function scoreBlock(score){
  if(!score||!score.scores) return "";
  const rows=Object.keys(score.scores).map(k=>'<div class="screv"><span>'+esc(criteriaLabel(k))+'</span><b>'+esc(score.scores[k])+'</b></div>').join("");
  return '<div class="scorecard"><div class="scorecardtop"><span>Your score</span>'+
    '<span class="scorecardtot">'+esc(score.total)+' <small>/ '+esc(score.max)+'</small></span></div>'+
    '<div class="screvs">'+rows+'</div></div>';
}

async function callBackend(action, payload={}){
  let raw;
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action,payload}),redirect:"follow"});
    raw=await res.text();
  }catch(err){ setConn(false); throw new Error("Could not reach the server. Check your connection and try again."); }
  setConn(true);
  let parsed;
  try{ parsed=JSON.parse(raw); } catch(e){ throw new Error("The server sent an unexpected response. Try again in a moment."); }
  if(!parsed.success) throw new Error(parsed.error || "Something went wrong.");
  return parsed.data;
}

function startOfToday(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return String(iso);
  return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"}); }
function dueState(iso){
  if(!iso) return {cls:"open",label:"No due date"};
  const d=new Date(iso); if(isNaN(d)) return {cls:"open",label:String(iso)};
  d.setHours(0,0,0,0);
  const days=Math.round((d-startOfToday())/86400000);
  if(days<0) return {cls:"overdue",label:"Overdue, due "+fmtDate(iso)};
  if(days===0) return {cls:"soon",label:"Due today"};
  if(days===1) return {cls:"soon",label:"Due tomorrow"};
  if(days<=3) return {cls:"soon",label:"Due "+fmtDate(iso)};
  return {cls:"open",label:"Due "+fmtDate(iso)};
}

function renderTasks() {
  const list = $("taskList");
  const allTasks = studentTasks();
  const filter = $("taskTypeFilter").value || "all";
  const tasks = filter === "all" ? allTasks : allTasks.filter(task => task.type === filter);
  const pending = tasks.filter(task => !submittedTask(task)).sort((a, b) => {
    const first = Date.parse(a.dueDate) || Infinity;
    const second = Date.parse(b.dueDate) || Infinity;
    return first - second || 0;
  });
  const completed = tasks.filter(submittedTask).reverse();
  $("studentTaskCount").textContent = allTasks.filter(task => !submittedTask(task)).length;
  list.replaceChildren(...pending.map(task => taskEl(task, false)));
  if (!pending.length) {
    const notice = document.createElement("p");
    notice.className = "emptyline";
    notice.textContent = filter === "all" ? "No open tasks." : "No open tasks of this type.";
    list.append(notice);
  }
  if (!completed.length) return;
  const group = document.createElement("details");
  group.className = "completed";
  group.open = completedOpen;
  const label = document.createElement("summary");
  label.textContent = "Completed (" + completed.length + ")";
  group.append(label, ...completed.map(task => taskEl(task, true)));
  group.addEventListener("toggle", () => { completedOpen = group.open; });
  list.append(group);
}

const EHAN_LOOP_IDS=["reading-word-cloze-ehan-20261106","writing-asat-docix-ehan-20261106"];
function studentTasks() {
  const tasks = (ctx.assignments || []).slice();
  if (rowKey(student.nameKey) !== "ehan") return tasks;
  const saved = safe(lsGet("noof_ehan_loop_v1_ehan")) || {};
  const writingDone = saved.writing?.delivery === "sent";
  const readingDone = writingDone || saved.reading?.delivery === "sent" ||
    (ctx.readingHistory || []).some(r => String(r.paperId) === EHAN_LOOP_IDS[0]);
  const localTasks = [
    {type:"reading", sourceId:EHAN_LOOP_IDS[0], title:"Word cloze · 30 questions & mistake review", status:readingDone?"submitted":"pending"},
    {type:"writing", sourceId:EHAN_LOOP_IDS[1], title:"ASAT · Rewrite your Docix speech", status:writingDone?"submitted":"pending"},
  ];
  return localTasks.filter(item => !tasks.some(task => String(task.sourceId) === item.sourceId)).concat(tasks);
}

function taskEl(task, done) {
  const row = document.createElement("div");
  const due = dueState(task.dueDate);
  row.className = "task " + (done ? "done" : due.cls);
  const source = String(task.sourceId || "");
  const isTest = source === PERSUASIVE_TEST_ID;
  const drill = WRITING_DRILLS[source];
  const isReading = task.type === "reading";
  const kind = task.type === "revision" ? "Revision" : drill?.label || (isTest ? "Writing test" : isReading ? "Reading" : "Writing");
  const icon = isReading ? IC_READ : task.type === "revision" ? IC_REV : IC_WRITE;
  const meta = done ? "Submitted" : task.dueDate
    ? '<span class="due ' + due.cls + '">' + esc(due.label) + '</span>' : isTest ? "Untimed" : "";
  row.innerHTML = '<div class="ticon" aria-hidden="true">' + icon + '</div><div class="tmid"><p class="ttitle">' +
    esc(task.title) + '</p><p class="tmeta">' + kind + (meta ? " · " + meta : "") + '</p></div>';

  const feedback = (ctx.feedbackInbox || []).find(f => task.type === "revision"
    ? String(f.submissionId) === source
    : String(f.promptId) === source || (!f.promptId && f.promptTitle === task.title));
  function action(text, execute) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn sm" + (done ? " ghost" : "");
    button.textContent = text;
    button.addEventListener("click", execute);
    row.append(button);
  }
  if (!done) {
    action(taskActionLabel(task, source), () => startTask(task));
  } else if (feedback) {
    action("Feedback", () => {
      selectStudentView("feedback");
      const item = Array.from($("inboxList").querySelectorAll("details"))
        .find(detail => detail.dataset.submission === String(feedback.submissionId || feedback.promptTitle));
      if (item) {
        item.open = true;
        item.querySelector("summary").focus();
        item.scrollIntoView({block:"nearest"});
      }
    });
  } else if (isTest || EHAN_LOOP_IDS.includes(source)) {
    action("View answers", () => startTask(task));
  }
  return row;
}

function taskActionLabel(task, source) {
  const name = rowKey(student.nameKey);
  if (source === "hast-reading-2") {
    const attempt = safe(lsGet("gribbin:reading:" + source + ":" + name));
    if (Number.isFinite(attempt?.finished)) return "Results";
    if (Number.isFinite(attempt?.started)) return "Resume";
  }
  if (source === "writing-pet-practice-20261122") {
    const state = safe(lsGet("gribbin-tutoring:pet-paragraph-practice:v1:" + encodeURIComponent(name) + ":" + source));
    if (Array.isArray(state?.drafts) && state.drafts.some(draft =>
      ["point", "evidence", "technique"].some(key => String(draft?.[key] ?? "").trim()))) return "Resume";
  }
  if (source === PERSUASIVE_TEST_ID) {
    const saved = testDraft();
    if (saved && Object.values(saved.answers || {}).some(answer => String(answer ?? "").trim())) return "Resume";
  }
  if (task.type !== "reading") {
    const part = task.type === "revision" ? "rev_" + source : source;
    const draft = safe(lsGet("noof_draft_" + student.nameKey + "_" + part));
    if (String(draft?.text ?? "").trim() || String(draft?.plan ?? "").trim()) return "Resume";
  }
  return "Open";
}

function openLinkedTask(target, parameters) {
  try {
    const url = new URL(target, location.href);
    if (!["http:", "https:"].includes(url.protocol) && !(location.protocol === "file:" && url.protocol === "file:")) {
      throw Error("Unsupported link");
    }
    for (const [key, value] of Object.entries(parameters)) url.searchParams.set(key, value);
    window.location.href = url.href;
  } catch {
    toast("This task link could not be opened.");
  }
}

function startTask(task) {
  const source = String(task.sourceId || "");
  const name = student.nameKey;
  if (EHAN_LOOP_IDS.includes(source)) {
    return openLinkedTask("Ehan_Reading_Writing_Loop.html", {student:name, view:source === EHAN_LOOP_IDS[1] ? "writing" : "reading"});
  }
  const drill = WRITING_DRILLS[source];
  if (source === PERSUASIVE_TEST_ID || (task.type === "writing" && (task.targetUrl || drill))) {
    return openLinkedTask(task.targetUrl || drill?.url || PERSUASIVE_TEST_URL, {student:name, paper:source});
  }
  if (task.type === "revision") return openRevision(task);
  if (task.type === "writing") {
    const prompt = (ctx.prompts || []).find(item => String(item.promptId) === source);
    return openWriting(prompt || {promptId:source || "writing-task", title:task.title, text:"", category:"Writing", minutes:30});
  }
  openLinkedTask(task.targetUrl || "Selective_Reading_Mock_Test.html", {student:name, paper:source});
}

/* build a student-facing annotated draft: highlighted ranges + numbered notes */
function annotatedDraft(text, comments){
  const cs=(comments||[]).slice().filter(c=>c&&c.end>c.start).sort((a,b)=>a.start-b.start);
  let html="", pos=0, n=0; const notes=[];
  cs.forEach(c=>{
    if(c.start<pos) return;            // skip overlaps
    n++;
    html+=esc(text.slice(pos,c.start));
    html+='<mark class="cmark">'+esc(text.slice(c.start,c.end))+'</mark>';
    notes.push('<li><span class="cmnum">'+n+'</span><span>'+esc(c.note)+'</span></li>');
    pos=c.end;
  });
  html+=esc(text.slice(pos));
  return '<div class="annotwrap"><div class="annotdraft">'+html+'</div>'+
    (notes.length?'<ol class="annotnotes">'+notes.join("")+'</ol>':'')+'</div>';
}

function aggSkills(perSkillObjs){
  const agg={};
  (perSkillObjs||[]).forEach(ps=>{
    if(ps&&typeof ps==="object"){
      Object.keys(ps).forEach(k=>{ const o=ps[k]||{}; agg[k]=agg[k]||{c:0,t:0};
        agg[k].c+=Number(o.c)||0; agg[k].t+=Number(o.t)||0; });

  return Object.keys(agg).map(k=>({skill:k,c:agg[k].c,t:agg[k].t,pct:agg[k].t?agg[k].c/agg[k].t:0}))
    .sort((a,b)=>a.pct-b.pct);
}

function renderPrompt(text){
  // turns plain cell text into paragraphs and bullet lists.
  // lines beginning with *, - or • become list items; blank lines break groups.
  const lines=String(text||"").split(/\r?\n/);
  let html="", inList=false;
  const flush=()=>{ if(inList){ html+="</ul>"; inList=false; } };
  lines.forEach(line=>{
    const t=line.trim();
    if(!t){ flush(); return; }
    const m=t.match(/^[\*\-\u2022]\s+(.*)/);
    if(m){ if(!inList){ html+="<ul>"; inList=true; } html+="<li>"+esc(m[1])+"</li>"; }
    else { flush(); html+="<p>"+esc(t)+"</p>"; }
  });
  flush();
  return html||"<p></p>";
}

  reading: {search: "Search reading results", status: [], order: [...submissionOrder, ["low", "Lowest score"], ["high", "Highest score"]]},

const rowKey = value => String(value ?? "").trim().toLowerCase();
const byName = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "en-AU", {numeric: true, sensitivity: "base"});
const submittedTask = task => rowKey(task.status) === "submitted";

function feedbackSent(row) {
  const score = safe(row.score_json);
  const comments = safe(row.comments_json);
  return Boolean(String(row.tutor_feedback ?? "").trim() || String(row.target_words ?? "").trim() ||
    (score && Object.keys(score.scores || {}).length) || (Array.isArray(comments) && comments.length));
}

function needsFeedback(row) {
  return !feedbackSent(row) && Boolean(row.submission_id);
}

function adminRecords(data) {
  const roster = new Map();
  const papers = new Map((data.readingPapers || []).map(p => [rowKey(p.paper_id), p.title || p.paper_id]));
  const prompts = new Map((data.prompts || []).map(p => [rowKey(p.prompt_id), p.title || p.prompt_id]));
  function register(raw, display, year) {
    const key = rowKey(raw);
    if (key && !roster.has(key)) {
      roster.set(key, {key, raw: String(raw).trim(), display: String(display || raw).trim(), year, unmarked: 0});
    }
    return key;
  }
  (data.students || []).forEach(s => register(s.name_key, s.display_name, s.year_level));
  const writing = (data.writing || []).flatMap(row => {
    const key = register(row.name_key);
    if (!key) return [];
    const unmarked = needsFeedback(row);
    if (unmarked) roster.get(key).unmarked += 1;
    return [{row, key, status: feedbackSent(row) ? "sent" : unmarked ? "unmarked" : "archived",
      title: row.prompt_title || prompts.get(rowKey(row.prompt_id)) || "Writing", date: row.timestamp}];
  });
  const reading = (data.reading || []).flatMap(row => {
    const key = register(row.name_key);
    return key ? [{row, key, title: papers.get(rowKey(row.paper_id)) || row.paper_id || "Reading", date: row.timestamp}] : [];
  });
  const tasks = (data.assignments || []).flatMap(row => {
    const key = register(row.student_key);
    if (!key) return [];
    const due = isoLike(row.due_date);
    const status = submittedTask(row) ? "submitted" : due && dueState(due).cls === "overdue" ? "overdue" : "pending";
    return [{row, key, title: row.title || "Assignment", date: row.assigned_date, due, status}];
  });
  return {roster, writing, reading, tasks};
}
let records = null;

const recordsPerPage = 24;

function filteredRecords(section, view = adminView, data = records) {
  const {query, status, order} = view.filters[section];
  const words = rowKey(query).split(/\s+/).filter(Boolean);
  const stamp = value => +new Date(isoLike(value) || 0) || 0;
  const pct = entry => Number(entry.row.out_of) > 0 ? Number(entry.row.score) / Number(entry.row.out_of) : -1;
  return data[section].filter(entry => {
    if (view.student && entry.key !== view.student) return false;
    if (status !== "all" && !(status === "pending" ? entry.status !== "submitted" : entry.status === status)) return false;
    const haystack = rowKey([entry.title, data.roster.get(entry.key).display, entry.key,
      entry.row.prompt_id, entry.row.paper_id, entry.row.source_id].filter(Boolean).join(" "));
    return words.every(word => haystack.includes(word));
  }).sort((a, b) => {
    const newest = () => stamp(b.date) - stamp(a.date);
    if (order === "oldest") return -newest();
    if (order === "name") return byName(data.roster.get(a.key).display, data.roster.get(b.key).display) || newest();
    if (order === "title") return byName(a.title, b.title) || newest();
    if (order === "due") return (stamp(a.due) || Infinity) - (stamp(b.due) || Infinity) || newest();
    if (order === "low") return pct(a) - pct(b) || newest();
    if (order === "high") return pct(b) - pct(a) || newest();
    return newest();
  });
}

  $("markNext").hidden = section !== "writing" || !visibleRecords.some(entry => entry.status === "unmarked");
  $("adminData").innerHTML = visibleRecords.length
    ? entries.map((entry, index) => renderRecord(section, entry, offset + index)).join("")
    : '<p class="emptyline">No matching ' + ({writing:"submissions",reading:"reading results",tasks:"assignments"}[section]) + '.</p>';
  const skills = $("adminReadingSkills");
  const totals = section === "reading" && visibleRecords.length
    ? aggSkills(visibleRecords.map(entry => safe(entry.row.per_skill_json))) : [];
  skills.hidden = totals.length === 0;
  skills.innerHTML = totals.length ? '<details><summary>Skills across these results</summary>' + totals.map(skillBarRow).join("") + '</details>' : "";
  if (currentSubmission) updateEditorNav();
}

function renderRecord(section, entry, index) {
  const row = entry.row;
  const date = stampLabel(entry.date, true);
  let actions, meta, detail = "";
  if (section === "writing") {
    const knownUntimed = String(row.prompt_id) === PERSUASIVE_TEST_ID ||
      (adminCache.prompts || []).some(prompt => String(prompt.prompt_id) === String(row.prompt_id) &&
        (String(prompt.minutes) === "0" || rowKey(prompt.minutes) === "unlimited"));
    meta = recordMeta(entry, [date, row.word_count !== "" && row.word_count != null ? row.word_count + " words" : "", knownUntimed ? "Untimed" : duration(row.time_used_sec)]);
    const label = entry.status === "sent" ? "Feedback sent" : entry.status === "unmarked" ? "Needs feedback" : "Archived";
    actions = '<span class="pill ' + (entry.status === "sent" ? "sent" : entry.status === "unmarked" ? "pending" : "") + '">' + label + '</span>' +
      '<button type="button" class="btn ghost tiny" data-edit="' + index + '">' + (entry.status === "unmarked" ? "Mark" : "Open") + '</button>';
  } else if (section === "reading") {
    const total = Number(row.out_of);
    const ratio = total > 0 ? Math.round(Number(row.score) / total * 100) : null;
    meta = recordMeta(entry, [date, duration(row.time_used_sec)]);
    actions = row.score != null ? '<span class="pill">' + esc(row.score) + (total > 0 ? ' / ' + total : '') + (ratio !== null ? ' · ' + ratio + '%' : '') + '</span>' : '';
    const storedWrong = safe(row.wrong_json);
    const wrong = Array.isArray(storedWrong) ? storedWrong.filter(w => w && typeof w === "object") : null;
    const aggregate = aggSkills([safe(row.per_skill_json)]);
    if (Array.isArray(wrong) || aggregate.length) {
      const showNotes = Array.isArray(wrong) && wrong.some(w => w?.explanation);
      detail = '<details><summary>Result details</summary>';
      if (Array.isArray(wrong) && wrong.length) {
        detail += '<div class="table-wrap"><table class="autopsy"><thead><tr><th scope="col">Q</th><th scope="col">Skill</th><th scope="col">Chose</th><th scope="col">Answer</th>' +
          (showNotes ? '<th scope="col">Explanation</th>' : '') + '</tr></thead><tbody>' +
          wrong.map(w => '<tr><td>' + esc(w.q) + '</td><td>' + esc(w.skill) + '</td><td class="pick">' + esc(w.picked ?? "–") +
            '</td><td class="corr">' + esc(w.correct ?? "–") + '</td>' + (showNotes ? '<td>' + esc(w.explanation) + '</td>' : '') + '</tr>').join("") + '</tbody></table></div>';
      } else if (Array.isArray(wrong)) {
        detail += '<p class="aitemmeta">No missed questions.</p>';
      }
      if (aggregate.length) detail += '<div class="skillbar">' + aggregate.map(skillBarRow).join("") + '</div>';
      detail += '</details>';
    }
  } else {
    const label = entry.status === "submitted" ? "Submitted" : entry.status === "overdue" ? "Overdue" : "Pending";
    const kind = row.task_type ? row.task_type[0].toUpperCase() + row.task_type.slice(1) : "";
    meta = recordMeta(entry, [kind, entry.due && "Due " + stampLabel(entry.due, true), date && "Assigned " + date]);
    actions = '<span class="pill ' + (entry.status === "submitted" ? "sent" : "pending") + '">' + label + '</span>' +
      (row.task_id ? '<button type="button" class="btn ghost tiny" data-remove="' + index + '">Remove</button>' : '');
  }
  return '<article class="record"><div class="record-top"><div><p class="record-title">' + esc(entry.title) +
    '</p><p class="record-meta">' + meta + '</p></div><div class="record-actions">' + actions + '</div></div>' + detail + '</article>';
}

function draftKeyFor(entry) {
  const row = entry.row;
  return row.submission_id || JSON.stringify([entry.key, entry.date, row.prompt_id, row.response_text]);
}

function adjacentSubmission(direction) {
  const index = visibleRecords.findIndex(entry => draftKeyFor(entry) === adminView.editor);
  if (index >= 0) {
    editorPosition = index;
    return visibleRecords[index + direction];
  }
  return visibleRecords[editorPosition + (direction < 0 ? -1 : 0)];
}

function updateEditorNav() {
  $("previousSubmission").disabled = !adjacentSubmission(-1);
  $("nextSubmission").disabled = !adjacentSubmission(1);
}

function moveToSubmission(direction) {
  const next = adjacentSubmission(direction);
  if (!next) return;
  closeEditor();
  openEditor(next);
}

function openEditor(entry, moveFocus = true) {
  if (!entry) return;
  currentSubmission = entry;
  const row = entry.row;
  const key = draftKeyFor(entry);
  adminView.editor = key;
  editorPosition = Math.max(0, visibleRecords.findIndex(row => draftKeyFor(row) === key));
  adminView.page = Math.floor(editorPosition / recordsPerPage);
  const draft = draftEdits.get(key);
  const bid = "active";
  const dayInput = draft?.days ?? 7;
  const comments = draft?.comments || safe(row.comments_json);
  const revisionsAllowed = String(row.prompt_id) !== PERSUASIVE_TEST_ID;
  adminDraftText[bid] = String(row.response_text ?? "");
  adminComments[bid] = Array.isArray(comments) ? comments.filter(c => c && Number.isInteger(c.start) &&
    Number.isInteger(c.end) && c.start >= 0 && c.end <= adminDraftText[bid].length && c.end > c.start).map((comment, index) =>
      ({...comment, id: "comment-" + index})) : [];
  const editor = $("adminEditor");
  const meta = [records.roster.get(entry.key)?.display, stampLabel(entry.date, true),
    row.word_count !== "" && row.word_count != null ? row.word_count + " words" : ""].filter(Boolean).map(esc).join(" · ");
  editor.innerHTML = '<div class="editor-nav"><button type="button" class="btn ghost tiny" id="closeEditor">Back to submissions</button>' +
    '<div class="row"><button type="button" class="btn ghost tiny" id="previousSubmission" aria-label="Previous submission">Previous</button>' +
    '<button type="button" class="btn ghost tiny" id="nextSubmission" aria-label="Next submission">Next</button></div></div>' +
    '<h3 class="editor-title" tabindex="-1" id="editorHeading">' + esc(entry.title) + '</h3><p class="aitemmeta">' + meta + '</p>' +
    '<div class="editor-grid"><div><h3>Submission</h3>' +
    (row.submission_id ? '<p class="page-meta">Select text to add a comment.</p>' : '') +
    '<div id="draft-active" class="draftsurface" tabindex="0"></div><div id="cmts-active" class="cmtlist"></div></div>' +
    '<div class="editor-controls"><label for="fb-active">Feedback</label><textarea id="fb-active" spellcheck="false">' +
    esc(draft?.feedback ?? row.tutor_feedback) + '</textarea><label for="tw-active">Vocabulary <small>Comma-separated</small></label>' +
    '<input type="text" id="tw-active" value="' + escAttr(draft?.targetWords ?? row.target_words) + '" spellcheck="false">' +
    '<details class="rubric-toggle"><summary>Rubric</summary>' +
    scoreEditor(bid, draft ? draft.score : safe(row.score_json), row.prompt_id, row.response_text) + '</details>' +
    '<div class="revopt"><input type="checkbox" id="rev-active"' + ((draft?.revision ?? (revisionsAllowed && needsFeedback(row))) ? " checked" : "") +
    '><label for="rev-active">Assign revision</label><input aria-label="Revision due in days" type="number" id="revd-active" value="' +
    escAttr(dayInput) + '" min="1" step="1"><span>days</span></div><div class="pushrow"><button type="button" class="btn sm" id="sendFeedback"' +
    (row.submission_id ? "" : " disabled") + '>Send feedback</button></div>' +
    '<div id="editorNotice" role="status">' + (row.submission_id ? "" : '<p class="page-meta">This older submission has no submission ID.</p>') +
    '</div></div></div>';
  $("adminResults").hidden = true;
  editor.hidden = false;
  renderDraftHighlights(bid);
  renderCommentList(bid);
  if (draft?.rubricOpen) editor.querySelector(".rubric-toggle").open = true;
  $("closeEditor").onclick = () => { closeEditor(); renderAdminList(); $("recordSearch").focus(); };
  $("previousSubmission").onclick = () => moveToSubmission(-1);
  $("nextSubmission").onclick = () => moveToSubmission(1);
  updateEditorNav();
  $("sendFeedback").onclick = sendEditorFeedback;
  if (moveFocus) $("editorHeading").focus();
}

function editorValues() {
  return {
    comments: (adminComments.active || []).slice(),
    feedback: $("fb-active").value,
    targetWords: $("tw-active").value,
    score: gatherScore("active"),
    revision: $("rev-active").checked,
    days: $("revd-active").value,
    rubricOpen: Boolean($("adminEditor").querySelector(".rubric-toggle")?.open),
  };
}

function closeEditor() {
  if (currentSubmission && $("fb-active")) draftEdits.set(adminView.editor, editorValues());
  currentSubmission = null;
  adminView.editor = "";
  adminComments = {}; adminDraftText = {}; adminScoreSchemas = {};
  hideCmtPop();
  $("adminEditor").replaceChildren();
  $("adminEditor").hidden = true;
  $("adminResults").hidden = false;
}

async function sendEditorFeedback() {
  if (!currentSubmission?.row.submission_id || !adminCache) return;
  const target = currentSubmission;
  const session = adminCache;
  const key = adminView.editor;
  const button = $("sendFeedback");
  const draft = editorValues();
  if (adminScoreSchemas.active === PERSUASIVE_CRITERIA && draft.score &&
      Object.keys(draft.score.scores).length !== criteriaFlat(PERSUASIVE_CRITERIA).length) {
    msg($("editorNotice"), "err", "Enter a mark for every part of the test.");
    return;
  }
  const due = Number(draft.days);
  if (draft.revision && (!Number.isInteger(due) || due < 1)) {
    msg($("editorNotice"), "err", "Enter the number of days until the revision is due.");
    $("revd-active").focus();
    return;
  }
  clearMsg($("editorNotice"));
  busy(button, true, "Sending");
  try {
    const scoreJson = draft.score ? JSON.stringify(draft.score) : "";
    const commentsJson = draft.comments.length ? JSON.stringify(draft.comments) : "";
    await callBackend("saveFeedback", {password: session.password, submissionId: target.row.submission_id,
      feedback: draft.feedback, targetWords: draft.targetWords, scoreJson, commentsJson,
      requestRevision: draft.revision, revisionDueDays: due || 7});
    if (adminCache !== session) return;
    const live = (adminCache.writing || []).find(row => row.submission_id === target.row.submission_id);
    if (live) Object.assign(live, {tutor_feedback: draft.feedback, target_words: draft.targetWords, score_json: scoreJson, comments_json: commentsJson});
    adminStateRevision += 1;
    indexAdminData();
    if (draftEdits.get(key)?.revision) draftEdits.get(key).revision = false;
    if (currentSubmission === target) {
      $("rev-active").checked = false;
      msg($("editorNotice"), "ok", draft.revision ? "Feedback sent and revision assigned." : "Feedback sent.");
    } else {
      msg($("adminNotice"), "ok", draft.revision ? "Feedback sent and revision assigned." : "Feedback sent.");
    }
    renderAdmin();
    if (draft.revision) {
      try { await reloadConsole(session); }
      catch (error) { msg($("adminNotice"), "info", "Revision assigned. Refresh to update the list."); }
    }
  } catch (error) {
    if (currentSubmission === target) msg($("editorNotice"), "err", error.message);
    else if (adminCache === session) msg($("adminNotice"), "err", error.message);
  } finally {
    busy(button, false);
  }
}

async function reloadConsole(session) {
  const revision = ++adminStateRevision;
  const data = await callBackend("getResults", {password: session.password});
  if (adminCache !== session || revision !== adminStateRevision) return;
  Object.assign(session, data, {password: session.password});
  indexAdminData();
  renderAdmin();
}

function validTaskLink(link) {
  if (!link) return true;
  try {
    return ["http:", "https:"].includes(new URL(link, document.baseURI).protocol);
  } catch {
    return false;
  }
}

async function assignTask(event) {
  event.preventDefault();
  if (!adminCache) return;
  const session = adminCache;
  const button = $("asSubmit");
  const body = {password: session.password, studentKey: $("asStudent").value,
    taskType: $("asType").value, title: $("asTitle").value.trim(),
    targetUrl: $("asUrl").value.trim(), sourceId: $("asSource").value.trim(), dueDate: $("asDue").value};
  clearMsg($("asMsg"));
  if (!body.title || !validTaskLink(body.targetUrl)) {
    $("asDetails").open = true;
    msg($("asMsg"), "err", body.title ? "Enter a valid page link." : "Enter a task title.");
    return;
  }
  busy(button, true, "Assigning");
  try {
    await callBackend("assignTask", body);
    if (adminCache !== session) return;
    $("assignDialog").close();
    const name = records.roster.get(rowKey(body.studentKey))?.display || body.studentKey;
    try {
      await reloadConsole(session);
      if (adminCache === session) msg($("adminNotice"), "ok", "Task assigned to " + name + ".");
    } catch {
      if (adminCache === session) msg($("adminNotice"), "info", "Task assigned. Refresh to update the list.");
    }
  } catch (error) { msg($("asMsg"), "err", error.message); }
  finally { busy(button, false); }
}

async function removeAssignment(entry, button) {
  if (!entry?.row.task_id || !confirm("Remove " + entry.title + "?")) return;
  const session = adminCache;
  busy(button, true, "Removing");
  try {
    await callBackend("deleteTask", {password: session.password, taskId: entry.row.task_id});
    if (adminCache !== session) return;
    adminCache.assignments = (adminCache.assignments || []).filter(row => row.task_id !== entry.row.task_id);
    adminStateRevision += 1;
    indexAdminData();
    renderAdmin();
    msg($("adminNotice"), "ok", "Assignment removed.");
  } catch (error) {
    if (adminCache === session) msg($("adminNotice"), "err", error.message);
  } finally { busy(button, false); }
}

/* ===== inline annotation engine (tutor side) ===== */
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }
function caretOffset(surface,node,offset){
  const r=document.createRange(); r.selectNodeContents(surface); r.setEnd(node,offset);
  return r.toString().length;
}
function renderDraftHighlights(bid){
  const surface=document.getElementById("draft-"+bid); if(!surface) return;
  const scroll=surface.scrollTop;
  const text=adminDraftText[bid]||"";
  const cs=(adminComments[bid]||[]).slice().sort((a,b)=>a.start-b.start);
  let html="", pos=0;
  cs.forEach(c=>{ if(c.start<pos) return;
    html+=esc(text.slice(pos,c.start));
    html+='<mark class="cmark" data-id="'+c.id+'" title="'+escAttr(c.note)+'">'+esc(text.slice(c.start,c.end))+'</mark>';
    pos=c.end; });
  html+=esc(text.slice(pos));
  surface.innerHTML=html;
  surface.scrollTop=scroll;
}
function renderCommentList(bid){
  const el=document.getElementById("cmts-"+bid); if(!el) return;
  const cs=(adminComments[bid]||[]).slice().sort((a,b)=>a.start-b.start);
  el.innerHTML=cs.length
    ? cs.map((c,i)=>'<div class="cmtitem"><span class="cmnum">'+(i+1)+'</span>'+
        '<div class="cmtbody"><div class="cmtq">&ldquo;'+esc(c.quote)+'&rdquo;</div><div class="cmtn">'+esc(c.note)+'</div></div>'+
        '<button class="linkbtn" onclick="delComment(\''+bid+'\',\''+c.id+'\')">Remove</button></div>').join("")
    : '<div class="aitemmeta" style="margin-top:8px">No inline comments yet.</div>';
}
let cmtPending=null;
document.addEventListener("mouseup",e=>{
  if(e.target.closest && e.target.closest("#cmtPop")) return;     // ignore clicks in the popup
  const surface=e.target.closest && e.target.closest(".draftsurface");
  const sel=window.getSelection();
  if(!surface || !sel || !sel.rangeCount || sel.isCollapsed){ if(!(e.target.closest&&e.target.closest("#cmtPop"))) hideCmtPop(); return; }
  const range=sel.getRangeAt(0);
  if(!surface.contains(range.startContainer)||!surface.contains(range.endContainer)){ hideCmtPop(); return; }
  if(!currentSubmission?.row.submission_id) return;
  const bid=surface.id.replace("draft-","");
  const start=caretOffset(surface,range.startContainer,range.startOffset);
  const end=caretOffset(surface,range.endContainer,range.endOffset);
  if(end<=start){ hideCmtPop(); return; }
  const quote=(adminDraftText[bid]||"").slice(start,end);
  cmtPending={bid,start,end,quote};
  showCmtPop(range);
});
function showCmtPop(range){
  const pop=$("cmtPop"); const rect=range.getBoundingClientRect();
  pop.classList.remove("hidden");
  $("cmtPopText").value=""; $("cmtPopQuote").textContent="\u201C"+cmtPending.quote+"\u201D";
  const pw=Math.min(320,window.innerWidth-20);
  let left=rect.left+window.scrollX; left=Math.max(10,Math.min(left,window.scrollX+window.innerWidth-pw-10));
  pop.style.width=pw+"px"; pop.style.left=left+"px"; pop.style.top=(rect.bottom+window.scrollY+8)+"px";
  setTimeout(()=>$("cmtPopText").focus(),0);
}
function hideCmtPop(){ $("cmtPop").classList.add("hidden"); cmtPending=null; }
$("cmtPopAdd").onclick=()=>{
  if(!cmtPending) return; const note=$("cmtPopText").value.trim();
  if(!note){ $("cmtPopText").focus(); return; }
  const bid=cmtPending.bid;
  adminComments[bid]=adminComments[bid]||[];
  adminComments[bid].push({id:"c"+Date.now()+Math.floor(Math.random()*1000),start:cmtPending.start,end:cmtPending.end,quote:cmtPending.quote,note});
  renderDraftHighlights(bid); renderCommentList(bid);
  window.getSelection().removeAllRanges(); hideCmtPop();
};
$("cmtPopCancel").onclick=()=>{ window.getSelection().removeAllRanges(); hideCmtPop(); };
function delComment(bid,id){
  adminComments[bid]=(adminComments[bid]||[]).filter(c=>c.id!==id);
  renderDraftHighlights(bid); renderCommentList(bid);
}


function isoLike(v){ if(v==null||v==="") return null; const d=new Date(v); return isNaN(d)?String(v):d.toISOString(); }
function safe(v){ if(v==null||v==="") return null; if(typeof v==="object") return v; try{return JSON.parse(v);}catch(e){return null;} }


(async()=>{
  const params=new URLSearchParams(location.search);
  const sk=params.get("student");
  const bootName = sk || lsGet(SESSION_KEY) || "";
  if(bootName){
    $("nameInput").value=bootName;
    const ok=await doLogin(true);
    if(ok){
      const done=params.get("done");
      if(done==="reading") toast("Reading result saved.");
      else if(done==="writing") toast("Writing submitted.");
      else if(done==="test") toast("Test submitted");
      navHome();
    }else{
      clearSession();   // saved name no longer valid, e.g. removed by tutor
    }
  }
})();
</script>
