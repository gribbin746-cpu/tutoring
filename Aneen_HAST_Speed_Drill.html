<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A single timed HAST-style fiction and nonfiction reading paper for Aneen."><title>Aneen · HAST Reading Test</title><style>
:root{
  --navy:#002664; --navy2:#06376b; --blue:#1a73c0; --blue-soft:#e8f1fb;
  --bg:#eceff3; --panel:#ffffff; --border:#d3d9e1; --line:#e6eaef;

  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button{font-family:inherit}
.hidden{display:none!important}
header{height:54px;background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:24px;height:24px;flex:0 0 auto;color:#fff;opacity:.95}
.brand .mark svg{width:24px;height:24px;display:block}
.brand .ttl{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .pill{background:rgba(255,255,255,.16);padding:2px 9px;border-radius:999px;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;flex:0 0 auto}
.hright{display:flex;align-items:center;gap:12px}
.timer{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);padding:6px 12px;
  border-radius:8px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.timer.warn{background:#7a1f1a;color:#ffd9d4}
.timer svg{width:15px;height:15px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn-finish{background:#fff;color:var(--navy)}
.btn-finish:hover{background:#eaf0f8}
.progbar{position:fixed;top:54px;left:0;right:0;height:3px;background:var(--line);z-index:19}
.progbar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
main{position:fixed;top:57px;bottom:64px;left:0;right:0;display:flex}
.pane{height:100%;overflow:auto;background:var(--panel)}
.stim{flex:1 1 56%;border-right:1px solid var(--border);padding:26px 30px}
.qpane{flex:1 1 44%;padding:22px 28px}

.stim .extract-head{font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;margin:20px 0 8px}
.stim .work-title{font-family:var(--serif);font-weight:700;font-size:20px;margin:2px 0 12px}
.stim p,.stim .stanza{font-family:var(--serif);font-size:16px;line-height:1.62;margin:0 0 13px;color:#23272d}
.stanza{white-space:pre-line}
.gap{display:inline-block;min-width:30px;text-align:center;border-bottom:2px solid #b9c2cd;
  color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:700;padding:0 4px;border-radius:3px}
.gap.active{background:#fff3cf;border-bottom-color:var(--flag);color:#7a4d12}
.ex-block{margin:0 0 18px;padding:0 0 0 14px;border-left:3px solid var(--line)}
.ex-block .lbl{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--blue);margin:0 0 4px}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.qnum{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.flagbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;
  color:var(--muted);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.flagbtn svg{width:13px;height:13px}
.flagbtn.on{background:var(--flag-bg);border-color:var(--flag);color:#9a5713}
.qstem{font-size:16.5px;font-weight:600;line-height:1.5;margin:10px 0 16px}
.qstem .qq{font-style:italic;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;margin:0 0 10px;cursor:pointer;
  font-size:15px;line-height:1.45;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:#9db8d6;background:#fafcff}
.opt .badge{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid #b6c0cc;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .badge{background:var(--blue);border-color:var(--blue);color:#fff}
.opt:focus-visible{outline:3px solid #9bc2ec;outline-offset:2px}
.opt .otext{padding-top:2px}
footer{height:64px;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 16px;z-index:20}
.nav-side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.navwrap{flex:1 1 auto;overflow-x:auto;display:flex;gap:6px;padding:4px 2px;justify-content:center}
.navbtn{position:relative;flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1.5px solid var(--border);
  background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.navbtn.answered{background:var(--navy);border-color:var(--navy);color:#fff}
.navbtn.current{outline:3px solid #9bc2ec;outline-offset:1px;border-color:var(--blue)}
.navbtn.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--flag);border:1.5px solid #fff}
.btn-nav{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 15px;font-weight:600;
  font-size:14px;cursor:pointer;color:var(--ink)}
.btn-nav:hover:not(:disabled){background:#f1f4f8}
.btn-nav:disabled{opacity:.4;cursor:default}
.btn-nav.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-nav.primary:hover{background:var(--navy2)}
.overlay{position:fixed;inset:0;background:rgba(12,20,33,.55);z-index:40;display:flex;
  align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:90vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card .cap{background:var(--navy);color:#fff;padding:22px 28px}
.card .cap h1{margin:0 0 4px;font-size:21px}
.card .cap p{margin:0;opacity:.85;font-size:14px}
.card .body{padding:24px 28px}
.card .body h3{margin:18px 0 8px;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.card ul{margin:0 0 4px;padding-left:20px}
.card li{margin:0 0 7px;font-size:14.5px}
.field{display:flex;gap:10px;align-items:center;margin:16px 0 4px}
.field input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit}
.start-actions{display:flex;justify-content:flex-end;gap:10px;padding:18px 28px 24px}
.btn-primary{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer}
.btn-primary:hover{background:var(--navy2)}
.btn-ghost{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px 20px;font-weight:600;font-size:15px;cursor:pointer}
.scorerow{display:flex;gap:18px;align-items:center;margin:4px 0 18px}
.scorebig{font-size:46px;font-weight:800;color:var(--navy);line-height:1}
.scorebig small{font-size:20px;color:var(--muted);font-weight:600}
.scorepct{font-size:15px;color:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14.5px;margin:0 0 8px}
.brk .b-lbl{color:var(--muted)}
.brk .b-val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.results-actions{display:flex;gap:10px;justify-content:flex-end;padding:6px 28px 24px}
.skillrow{display:grid;grid-template-columns:175px 1fr 62px;gap:10px;align-items:center;margin:0 0 9px}
.skillrow .sl{font-size:13.5px;color:#2b323b}
.skilltrack{height:11px;background:#eef1f5;border-radius:6px;overflow:hidden}
.skillfill{height:100%;border-radius:6px;transition:width .4s}
.skillrow .sv{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.skillrow .sv b{color:#2b323b}
.autopsy{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut-wrap{position:relative;width:150px;height:150px;flex:0 0 auto}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center .dn{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.donut-center .dl{font-size:11px;color:var(--muted);letter-spacing:.03em}
.legend{flex:1 1 200px;min-width:200px}
.legend .lg{display:flex;align-items:center;gap:9px;margin:0 0 7px;font-size:13.5px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.legend .lc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:#2b323b}
.no-errors{background:var(--correct-bg);color:var(--correct);border-radius:10px;padding:14px 16px;font-weight:600;font-size:14.5px}
.focus{display:flex;flex-direction:column;gap:9px}
.focus .fitem{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:11px 13px;background:#fbfcfe}
.focus .fitem.warn{border-left-color:var(--flag)}
.focus .fitem.good{border-left-color:var(--correct);background:var(--correct-bg)}
.focus .ft{font-weight:700;font-size:14px;margin-bottom:2px}
.focus .fb{font-size:13.5px;color:#3a434e}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.01em}
.chip.skill{background:#eef2f7;color:#41506a}
.chip.err{background:var(--wrong-bg);color:var(--wrong)}
.rev-nums{font-size:13.5px;color:#2b323b;background:#f3f6fa;border-radius:8px;padding:9px 12px;margin:0 0 12px}
.rev-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);
  border-left:4px solid var(--wrong);border-radius:9px;padding:9px 12px;margin:0 0 8px}
.rev-row .rev-n{font-weight:800;color:var(--navy);font-size:14px;min-width:34px}
.rev-row .rev-ans{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rev-row .rev-ans b.no{color:var(--wrong)}
.rev-row .rev-ans b.ok{color:var(--correct)}
.rev-explanation{width:100%;padding-left:42px;font-size:12.5px;color:var(--muted)}
@media (max-width:880px){
  main{flex-direction:column;bottom:96px}
  .stim{flex:0 0 auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--border)}
  .qpane{flex:1 1 auto}
  footer{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
  .navwrap{order:3;width:100%;justify-content:flex-start}
  .brand .ttl{max-width:44vw}
  .skillrow{grid-template-columns:130px 1fr 58px}
}

        "By five o'clock the waiting room had emptied, except for a woman with a paper bag folded on her knees. Leila wiped the counter twice. Her father had left her in charge of the shoe-repair shop for an hour, and she had been enjoying the little bell, the tickets, the reassuring numbers on the shelves. The woman's ticket was number forty-three. Shelf forty-three was empty.",

function finish(expired=false){if(!attempt||attempt.finishedAt)return;clearInterval(timerId);attempt.finishedAt=Math.min(Date.now(),attempt.deadline);attempt.expired=expired;save();if($('confirmDialog').open)$('confirmDialog').close();$('liveStatus').textContent=expired?'Time is up. Your answers are locked and results are ready.':'Test submitted. Your answers are locked.';renderResults();if(portalStudent&&params.get('paper')&&/^https?:$/.test(location.protocol))sendResult();}
function renderResults(){clearInterval(timerId);$('startOverlay').hidden=true;$('resultsOverlay').hidden=false;$('testMain').hidden=true;$('testFooter').hidden=true;$('finishBtn').disabled=false;$('finishBtn').textContent='Results';$('timeText').textContent='Submitted';$('timer').classList.remove('warn');const s=stats();$('resultsWho').textContent=attempt.student+' · Reading test';$('scoreBig').innerHTML=s.correct+'<small> / '+s.total+'</small>';$('scorePct').textContent=Math.round(s.correct/s.total*100)+'% correct';$('scoreTime').textContent='Time used: '+fmt((attempt.finishedAt-attempt.startedAt)/1000);$('attemptSummary').textContent=(attempt.expired?'Time expired. ':'Test submitted. ')+s.answered+' answered · '+(s.total-s.answered)+' unanswered.';$('brkBox').innerHTML=Object.entries(s.byGenre).map(([g,v])=>'<div class="b-lbl">'+g+'</div><div class="b-val">'+v.c+' / '+v.t+'</div>').join('');$('skillBox').innerHTML=Object.entries(s.bySkill).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t).map(([sk,v])=>'<div class="skillrow"><div class="sl">'+esc(sk)+'</div><div class="skilltrack"><div class="skillfill" style="width:'+100*v.c/v.t+'%;background:'+(v.c/v.t>=.8?'var(--correct)':v.c/v.t>=.5?'#c9871f':'var(--wrong)')+'"></div></div><div class="sv"><b>'+v.c+'/'+v.t+'</b></div></div>').join('');$('reviewMap').innerHTML=Q.map((q,i)=>'<button class="'+(attempt.answers[q.n]===q.correct?'correct':Number.isInteger(attempt.answers[q.n])?'wrong':'blank')+'" data-review="'+i+'" aria-label="Review question '+q.n+'">'+q.n+'</button>').join('');syncSendState();$('resultsOverlay').querySelector('.card').scrollTop=0;}
function review(index=0){attempt.cur=index;save();$('resultsOverlay').hidden=true;$('testMain').hidden=false;$('testFooter').hidden=false;$('finishBtn').textContent='Results';renderQuestion();$('qpane').scrollTop=0;}
function resultData(){const s=stats();return {paper:'Aneen HAST Reading Test',paperId,student:attempt.student,startedAt:new Date(attempt.startedAt).toISOString(),submittedAt:new Date(attempt.finishedAt).toISOString(),timeUsedSeconds:Math.ceil((attempt.finishedAt-attempt.startedAt)/1000),timeExpired:attempt.expired,score:s.correct,outOf:s.total,answered:s.answered,byTextType:s.byGenre,bySkill:s.bySkill,questions:Q.map(q=>({number:q.n,extract:TEXTS.find(t=>t.id===q.extract).title,question:q.stem,skill:q.skill,submittedAnswer:Number.isInteger(attempt.answers[q.n])?letters[attempt.answers[q.n]]:null,correctAnswer:letters[q.correct],options:Object.fromEntries(q.options.map((o,i)=>[letters[i],o])),explanations:Object.fromEntries(q.reasons.map((r,i)=>[letters[i],r])),evidence:q.evidence,evidenceParagraph:q.paragraph}))};}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(resultData(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Aneen_HAST_Reading_Test_Results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function syncSendState(){const linked=!!portalStudent&&!!params.get('paper')&&/^https?:$/.test(location.protocol);$('sendBtn').hidden=!linked||attempt.sent;$('sendBtn').disabled=submissionPending;$('sendStatus').textContent=attempt.sent?'Score saved.':attempt.sendState==='pending'?'Saving score…':attempt.sendState==='unknown'?'Save not confirmed. Check the portal before resending.':'';}
async function sendResult(){if(!attempt||!attempt.finishedAt||attempt.sent||submissionPending)return;const linked=portalStudent&&params.get('paper')&&/^https?:$/.test(location.protocol);if(!linked)return;submissionPending=true;attempt.sendState='pending';save();syncSendState();const s=stats(),controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',signal:controller.signal,body:JSON.stringify({action:'submitReading',payload:{nameKey:attempt.nameKey,paperId,score:s.correct,outOf:Q.length,timeUsedSec:Math.ceil((attempt.finishedAt-attempt.startedAt)/1000),perSkillJson:s.bySkill,answersJson:Object.fromEntries(Q.map(q=>[q.n,Number.isInteger(attempt.answers[q.n])?letters[attempt.answers[q.n]]:null])),wrongJson:Q.filter(q=>attempt.answers[q.n]!==q.correct).map(q=>({q:q.n,picked:Number.isInteger(attempt.answers[q.n])?letters[attempt.answers[q.n]]:null,correct:letters[q.correct],skill:q.skill,issue:Number.isInteger(attempt.answers[q.n])?q.skill:'Unanswered',explanation:q.reasons[q.correct]}))}})});if(!response.ok)throw Error('Submission failed');const body=await response.json();if(!body.success)throw Error(body.error||'Submission not accepted');attempt.sent=true;attempt.sendState='sent';}catch(e){attempt.sendState='unknown';}finally{clearTimeout(timeout);submissionPending=false;save();syncSendState();}}
$('beginBtn').onclick=begin;$('finishBtn').onclick=()=>attempt&&attempt.finishedAt?renderResults():openConfirm();$('prevBtn').onclick=()=>move(attempt.cur-1);$('nextBtn').onclick=()=>{if(attempt.cur<Q.length-1)move(attempt.cur+1);else attempt.finishedAt?renderResults():openConfirm();};
$('opts').addEventListener('change',e=>{if(!editable())return;const radio=e.target;if(radio.name!=='answer')return;attempt.answers[Q[attempt.cur].n]=Number(radio.value);save();renderQuestion();});
$('flagBtn').onclick=()=>{if(!editable())return;const n=Q[attempt.cur].n;attempt.flags=attempt.flags.includes(n)?attempt.flags.filter(x=>x!==n):[...attempt.flags,n];save();renderQuestion();};
$('navwrap').onclick=e=>{const b=e.target.closest('[data-question]');if(b)move(Number(b.dataset.question));};$('reviewMap').onclick=e=>{const b=e.target.closest('[data-review]');if(b)review(Number(b.dataset.review));};
$('explanation').onclick=e=>{const b=e.target.closest('[data-evidence]');if(!b)return;document.querySelectorAll('#stim mark').forEach(m=>m.replaceWith(...m.childNodes));const p=$('p-'+b.dataset.evidence);p.innerHTML=p.innerHTML.replace(/(<span class="pnum"[^>]*>.*?<\/span>)([\s\S]*)/,'$1<mark>$2</mark>');p.scrollIntoView({block:'center',behavior:'smooth'});};
$('keepGoingBtn').onclick=()=>$('confirmDialog').close();$('confirmFinishBtn').onclick=()=>finish(false);$('reviewBtn').onclick=()=>review(0);$('downloadBtn').onclick=download;$('sendBtn').onclick=sendResult;$('backToDashBtn').onclick=()=>location.href=portalURL();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pagehide',save);
window.addEventListener('storage',e=>{if(!attempt||e.key!==storageKey(attempt.student)||!e.newValue)return;try{const remote=JSON.parse(e.newValue);if(remote.version===VERSION&&remote.startedAt===attempt.startedAt){attempt=remote;if(remote.finishedAt){renderResults();}else if(!$('startOverlay').hidden){welcome();}else renderQuestion();}}catch(e){}});
document.addEventListener('keydown',e=>{if(!attempt||!$('resultsOverlay').hidden||!$('startOverlay').hidden||$('confirmDialog').open)return;if(e.target.matches('input,textarea,select,button,a'))return;if(e.key==='ArrowRight'){e.preventDefault();attempt.cur<Q.length-1?move(attempt.cur+1):null;}else if(e.key==='ArrowLeft'){e.preventDefault();move(attempt.cur-1);}else if(/^[a-d]$/i.test(e.key)&&editable()){attempt.answers[Q[attempt.cur].n]=letters.indexOf(e.key.toUpperCase());save();renderQuestion();}});
$('nameInput').value=portalStudent?portalStudent.toLowerCase()==='aneen'?'Aneen':portalStudent.replace(/[_-]/g,' '):'Aneen';welcome();

</script>
</body></html>
